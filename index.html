<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로봇 매니퓰레이션 연구 — 위키</title>
<style>
:root{
  --link:#3366cc; --link-v:#795cb2; --red:#d73333;
  --rule:#a2a9b1; --rule-soft:#c8ccd1; --box:#f8f9fa; --th:#eaecf0;
  --ink:#202122; --muted:#54595d;
  --vla:#2b54d4; --rfm:#6e3fb0; --traj:#0e7c63; --mpc:#c05024; --data:#8a6a00;
}
*{box-sizing:border-box}
body{
  margin:0;background:#fff;color:var(--ink);
  font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14.6px;line-height:1.65;
}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
a.new{color:var(--red)}
a.ext::after{content:"\2197";font-size:.8em;vertical-align:super;margin-left:1px;opacity:.7}
:focus-visible{outline:2px solid var(--link);outline-offset:1px}

/* layout */
#shell{display:flex;align-items:flex-start}
#side{
  width:190px;flex:0 0 190px;padding:14px 12px 40px;
  border-right:1px solid var(--rule-soft);min-height:100vh;background:#fff;
  position:sticky;top:0;max-height:100vh;overflow-y:auto;
}
#side .brand{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.2;margin-bottom:2px}
#side .brand small{display:block;font-family:inherit;font-size:11px;color:var(--muted);letter-spacing:.02em;margin-top:3px}
#side hr{border:0;border-top:1px solid var(--rule-soft);margin:14px 0}
#side h4{font-size:11.5px;color:var(--muted);font-weight:400;margin:0 0 4px;padding-bottom:3px;border-bottom:1px solid var(--rule-soft)}
#side ul{list-style:none;margin:0 0 16px;padding:0;font-size:13px;line-height:1.95}
#side li.cur a{font-weight:700;color:var(--ink)}
#side input{width:100%;font:inherit;font-size:13px;padding:4px 7px;border:1px solid var(--rule-soft);margin-bottom:6px}
#results{font-size:12.5px;line-height:1.8;max-height:230px;overflow:auto}
#results div{padding:1px 0}

#main{flex:1;min-width:0;padding:12px 34px 60px;max-width:1000px}
@media(max-width:900px){
  #shell{display:block}
  #side{width:auto;position:static;max-height:none;min-height:0;border-right:0;border-bottom:1px solid var(--rule-soft)}
  #main{padding:12px 18px 50px}
}

/* article chrome */
.tabs{border-bottom:1px solid var(--rule);font-size:12.5px;color:var(--muted);padding-bottom:4px;margin-bottom:14px}
.tabs a{margin-right:14px}
h1.title{
  font-family:Georgia,"Times New Roman",serif;font-weight:400;
  font-size:28px;line-height:1.25;margin:0 0 .25em;padding-bottom:.15em;
  border-bottom:1px solid var(--rule);
}
h2{
  font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:21px;
  margin:1.5em 0 .5em;padding-bottom:.15em;border-bottom:1px solid var(--rule);
}
h3{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:16.5px;margin:1.3em 0 .4em}
p{margin:.55em 0}
.hat{font-style:italic;color:var(--muted);margin:.2em 0 .9em;padding-left:1.6em;font-size:13.6px}
.note-box{border:1px solid var(--rule-soft);border-left:4px solid var(--rule);background:var(--box);padding:9px 14px;margin:14px 0;font-size:13.6px;color:var(--muted)}
.stub{border:1px solid var(--rule-soft);background:var(--box);padding:8px 14px;margin:20px 0;font-size:13px;font-style:italic;color:var(--muted)}

/* toc */
.toc{display:inline-block;border:1px solid var(--rule);background:var(--box);padding:8px 20px 10px 12px;margin:14px 0 6px;font-size:13.4px}
.toc .h{text-align:center;font-weight:700;margin-bottom:5px}
.toc ol{list-style:none;counter-reset:s;margin:0;padding:0}
.toc ol ol{padding-left:16px;counter-reset:ss}
.toc li{counter-increment:s;line-height:1.85}
.toc ol ol li{counter-increment:ss}
.toc li::before{content:counter(s)" ";color:var(--ink)}
.toc ol ol li::before{content:counter(s)"."counter(ss)" "}

/* infobox */
.infobox{
  float:right;clear:right;width:23.5em;max-width:100%;margin:0 0 14px 20px;
  border:1px solid var(--rule);background:var(--box);font-size:12.8px;line-height:1.5;
}
.infobox .ib-title{background:var(--th);text-align:center;font-weight:700;padding:7px 8px;font-size:13.5px;border-bottom:1px solid var(--rule)}
.infobox .ib-sub{text-align:center;padding:5px 8px;color:var(--muted);border-bottom:1px solid var(--rule-soft);font-style:italic}
.infobox table{width:100%;border-collapse:collapse}
.infobox th{text-align:left;vertical-align:top;width:34%;padding:5px 8px;color:var(--muted);font-weight:400;border-bottom:1px solid #e6e8ea}
.infobox td{padding:5px 8px;border-bottom:1px solid #e6e8ea;word-break:break-word}
.infobox tr:last-child th,.infobox tr:last-child td{border-bottom:0}
@media(max-width:700px){.infobox{float:none;width:100%;margin:0 0 16px}}

/* tables */
table.wt{border-collapse:collapse;border:1px solid var(--rule);margin:12px 0;font-size:13.4px;width:100%;table-layout:fixed;min-width:640px}
table.wt th{background:var(--th);border:1px solid var(--rule);padding:6px 9px;text-align:left;font-weight:700;word-break:keep-all}
table.wt td{border:1px solid var(--rule);padding:6px 9px;vertical-align:top;word-break:keep-all;overflow-wrap:anywhere}
table.wt tr:hover td{background:#fbfcfd}
.tblwrap{overflow-x:auto;clear:right;margin:12px 0}
.nowrap{white-space:nowrap}
p,li,dd{word-break:keep-all}
.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:12.4px}

/* track chip */
.tk{display:inline-block;padding:0 6px;border:1px solid;font-size:11.5px;line-height:1.6;white-space:nowrap;vertical-align:1px}

/* refs */
ol.refs{font-size:12.9px;line-height:1.75;padding-left:2em}
ol.refs li{margin-bottom:3px}
sup.ref{font-size:.78em;vertical-align:super;line-height:0}

/* categories footer */
.cats{border:1px solid var(--rule-soft);background:var(--box);padding:7px 12px;margin-top:34px;font-size:12.8px}
.cats b{font-weight:700}
.foot{margin-top:14px;padding-top:10px;border-top:1px solid var(--rule-soft);font-size:12px;color:var(--muted)}

ul.plain{margin:.4em 0;padding-left:1.5em}
ul.plain li{margin:2px 0}
dl dt{font-weight:700;margin-top:9px}
dl dd{margin:0 0 0 1.6em}
</style>
</head>
<body>
<div id="shell">
  <nav id="side">
    <div class="brand">로봇 매니퓰레이션<small>연구 문헌 위키 · 2026-09</small></div>
    <hr>
    <input type="search" id="q" placeholder="문서 검색" aria-label="문서 검색" autocomplete="off">
    <div id="results"></div>
    <h4>둘러보기</h4>
    <ul id="nav-main"></ul>
    <h4>계열</h4>
    <ul id="nav-track"></ul>
    <h4>도구</h4>
    <ul>
      <li><a href="#/list">전체 논문 목록</a></li>
      <li><a href="#/timeline">연표</a></li>
      <li><a href="#/open-problems">미해결 문제</a></li>
    </ul>
  </nav>
  <main id="main"></main>
</div>

<script>
/* ═══════════════════ 데이터 ═══════════════════ */

const TRACKS = {
  vla:  {n:"VLA",            full:"Vision-Language-Action 모델", c:"var(--vla)"},
  rfm:  {n:"파운데이션·월드모델", full:"로봇 파운데이션 모델과 월드 모델", c:"var(--rfm)"},
  traj: {n:"궤적 최적화",     full:"Trajectory Optimization",    c:"var(--traj)"},
  mpc:  {n:"MPC",            full:"모델예측제어",                c:"var(--mpc)"},
  data: {n:"데이터·평가",     full:"데이터셋과 벤치마크",         c:"var(--data)"}
};

// s=slug, n=표제, full=원제, org=주체, d=시점, aid=식별자, venue, key=주요문서
// lead=요약, body=[[제목, 문단...], ...], see=관련문서
const P = [
/* ───────── VLA ───────── */
{s:"rt2",t:"vla",n:"RT-2",full:"RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control",org:"Google DeepMind",d:"2023-07",aid:"arXiv:2307.15818",venue:"CoRL 2023",key:1,
 lead:"사전학습된 시각-언어 모델을 로봇 데모로 파인튜닝해 이산화된 액션 토큰을 직접 출력하게 만든 대표 사례로, 오늘날 통용되는 VLA라는 범주 자체를 정립했다.",
 body:[
  ["핵심 아이디어","로봇 액션을 텍스트 토큰과 같은 자격으로 취급한다는 것이 전부다. 액션의 각 자유도를 이산 구간으로 양자화해 문자열로 표현하면, 시각-언어 모델의 출력 어휘에 그대로 얹을 수 있다. 그 결과 로봇 학습이 별도의 아키텍처 문제가 아니라 VLM 파인튜닝 문제가 된다."],
  ["기여","웹 규모 데이터로 학습된 의미 지식이 로봇 제어로 전이된다는 것을 실증했다. 학습 데모에 없던 물체 범주나 개념적 지시(예: 특정 속성을 만족하는 물체 고르기)에 대해 성능이 유지되는 현상을 보고했고, 이것이 이후 VLA 연구 전체의 동기가 되었다."],
  ["구성","PaLI-X와 PaLM-E를 백본으로 사용하고, 로봇 데모와 웹 시각-언어 데이터를 함께 섞어 공동 파인튜닝한다. 웹 데이터를 계속 섞는 것이 의미 지식 유지에 중요하다는 관찰은 이후 [[knowledge-insulation]]이 다루는 문제의 전조다."],
  ["물려준 한계","이산 표현의 양자화 오차와 자기회귀 디코딩의 속도 제약을 후속 연구가 그대로 물려받았다. [[fast]]가 토크나이저 쪽에서, [[pi0]]이 연속 표현 쪽에서 각각 이를 공략한다."]],
 see:["openvla","pi0","fast","knowledge-insulation"]},

{s:"octo",t:"vla",n:"Octo",full:"Octo: An Open-Source Generalist Robot Policy",org:"UC Berkeley 외",d:"2024-05",aid:"arXiv:2405.12213",venue:"RSS 2024",
 lead:"Open X-Embodiment의 약 80만 데모로 학습한 93M 규모의 경량 오픈소스 generalist 정책.",
 body:[
  ["핵심 아이디어","모든 입력을 토큰 시퀀스로 통일한다. 언어 지시는 언어 인코더로, 이미지 패치는 CNN 인코더로 토큰화해 하나의 트랜스포머에 넣고, 출력 임베딩을 확산 헤드로 디코딩해 연속 액션을 얻는다."],
  ["기여","블록 단위 어텐션 마스크 설계로 관측 모달리티나 액션 공간을 사후에 추가·교체할 수 있게 했다. 새로운 센서나 새로운 로봇을 붙일 때 모델을 처음부터 다시 학습하지 않아도 된다는 것이 실용적 장점이다."],
  ["위치","93M이라는 작은 규모로 훨씬 큰 모델에 준하는 성능을 보고해, 이후 오픈소스 경량 정책의 참조점이 되었다. 확산 헤드를 쓴다는 점에서 [[pi0]]의 flow matching action expert와 같은 계보에 있다."]],
 see:["oxe","openvla","pi0"]},

{s:"openvla",t:"vla",n:"OpenVLA",full:"OpenVLA: An Open-Source Vision-Language-Action Model",org:"Stanford · UC Berkeley · TRI 외",d:"2024-06",aid:"arXiv:2406.09246",venue:"CoRL 2024",key:1,
 lead:"오픈소스 generalist VLA. 액션 토큰을 LLaMA 토크나이저의 저빈도 토큰 256개 자리에 직접 끼워 넣어, 액션 생성을 텍스트와 동일한 next-token prediction 문제로 다룬다.",
 body:[
  ["핵심 아이디어","새 어휘를 추가하는 대신 기존 어휘를 재활용한다. LLaMA 토크나이저에서 거의 쓰이지 않는 토큰 256개를 골라 그 자리를 액션 구간에 할당하면, 임베딩 테이블도 출력 헤드도 손대지 않고 액션을 다룰 수 있다. 액션 각 차원은 분위수 기반으로 256구간에 매핑하는데, 분위수를 쓰는 이유는 이상치에 대한 견고성 때문이다."],
  ["기여","7B 규모 VLA를 가중치까지 공개하고, LoRA 파인튜닝과 양자화 배치 레시피를 함께 제공했다. 이것이 2024년 이후 오픈소스 비교 실험의 사실상 기준선이 된 실질적 이유다."],
  ["백본으로서의 역할","촉각 계열 논문 다수가 이 모델을 동결하고 잔차만 학습하는 방식을 택한다([[vitar]]). 실패 복구 계열도 이 모델의 은닉 상태를 프로브 대상으로 삼는다([[probeact]])."],
  ["한계","이산 자기회귀 구조 탓에 3~5Hz 수준의 추론 속도에 머물러 고주파 제어와 양팔 조작에 부적합하다는 지적이 반복된다. [[openvla-oft]]가 파인튜닝 레시피 쪽에서 이를 완화했다."]],
 see:["openvla-oft","rt2","fast","vitar","probeact"]},

{s:"rdt1b",t:"vla",n:"RDT-1B",full:"RDT-1B: a Diffusion Foundation Model for Bimanual Manipulation",org:"칭화대",d:"2024-10",aid:"arXiv:2410.07864",venue:"ICLR 2025",
 lead:"양팔 조작을 목표로 한 1B 규모 확산 파운데이션 모델.",
 body:[
  ["핵심 아이디어","양팔 조작의 어려움을 액션 분포의 다봉성 문제로 본다. 두 팔의 협응에는 동등하게 유효한 여러 해가 존재하므로 회귀 손실로 학습하면 평균으로 무너지는데, 확산 모델은 이 다봉성을 그대로 표현할 수 있다."],
  ["부수 기여","서로 다른 로봇의 이질적 액션 공간을 하나의 통일된 물리적 액션 표현으로 정렬해 사전학습에 쓸 수 있게 했다. cross-embodiment 문제를 액션 공간 정규화로 접근한 초기 사례다."],
  ["위치","[[agibot-go1]]이 성능 비교 대상으로 삼아 32% 개선을 보고했고, 그 과정에서 AgiBot World 데이터로 RDT를 재학습하면 얼마나 좋아지는지를 데이터 효과 분리 실험으로 활용했다."]],
 see:["agibot-go1","pi0"]},

{s:"pi0",t:"vla",n:"π0",full:"π0: A Vision-Language-Action Flow Model for General Robot Control",org:"Physical Intelligence",d:"2024-10",aid:"arXiv:2410.24164",venue:"arXiv 프리프린트",key:1,
 lead:"약 3B 규모의 PaliGemma 백본에 300M 규모 flow matching action expert를 결합한 구조로, 이산 토큰의 양자화 없이 연속 액션 청크를 생성한다. π 계열 전체의 출발점이다.",
 body:[
  ["핵심 아이디어","의미 이해와 운동 생성을 서로 다른 모듈에 맡긴다. 큰 VLM 백본은 시각·언어·상태를 이해하는 일만 하고, 작은 action expert가 그 은닉 상태를 조건으로 연속 액션을 생성한다. 액션 생성이 백본의 토큰 예측과 분리되므로 양자화 오차가 사라지고 고주파 제어가 가능해진다."],
  ["flow matching 정식화","학습 시 실제 액션 청크와 가우시안 잡음을 시간 인덱스 τ로 선형 보간해 입력을 만들고, 모델은 잡음에서 액션을 향하는 흐름장을 예측하도록 학습된다. 추론 시에는 잡음에서 출발해 이 흐름장을 적분하면 액션 청크가 나온다. 확산과 목적은 같지만 적분 스텝 수가 훨씬 적어 지연이 낮다."],
  ["기여","여러 로봇 플랫폼의 데이터를 섞은 cross-embodiment 사전학습 코퍼스를 구축하고, 그 위에서 세탁물 접기와 박스 조립 같은 장시간 양팔 과제를 수행했다. 액션 청크를 통째로 예측하는 방식이 실제 정밀 조작에서 작동한다는 것을 규모 있게 보인 사례다."],
  ["한계","연속 표현은 다봉 분포를 잘 다루지만 수렴에 훨씬 큰 연산 예산이 필요하다. 이 문제는 [[knowledge-insulation]]에서 이산 토큰과의 하이브리드 학습으로, 지연 문제는 [[snapflow]] 같은 증류 계열에서 각각 다뤄진다."]],
 see:["pi05","fast","knowledge-insulation","pistar06","snapflow"]},

{s:"fast",t:"vla",n:"FAST",full:"FAST: Efficient Action Tokenization for Vision-Language-Action Models",org:"Physical Intelligence",d:"2025-01",aid:"arXiv:2501.09747",venue:"RSS 2025",key:1,
 lead:"액션 청크에 이산 코사인 변환을 적용해 차원 간 상관을 제거한 뒤 바이트 페어 인코딩으로 압축하는 액션 토크나이저.",
 body:[
  ["문제 진단","단순 구간 분할 토크나이저는 고주파 데이터에서 무너진다. 50Hz로 수집된 궤적은 인접 시점의 액션이 거의 같아서, 시점별로 독립 양자화하면 토큰 시퀀스가 거의 상수열이 된다. 모델은 다음 토큰을 이전 토큰의 복사로 예측하는 지름길을 학습하고 실제 동작을 배우지 못한다."],
  ["핵심 아이디어","시간 영역이 아니라 주파수 영역에서 토큰화한다. 액션 청크의 각 차원에 이산 코사인 변환을 걸면 에너지가 저주파 소수 계수에 집중되고, 대부분의 고주파 계수는 0에 가까워진다. 이를 양자화한 뒤 BPE로 압축하면 반복 패턴이 하나의 토큰으로 병합된다. 결과적으로 50스텝 × 16차원의 청크가 16~32 토큰으로 줄어든다."],
  ["기여","자기회귀 VLA의 학습 속도와 추론 속도를 동시에 개선하면서, 확산·flow 기반 정책에 준하는 성능을 이산 구조로 달성할 수 있음을 보였다. 범용 토크나이저 FAST+를 별도로 공개해 새 로봇에 재학습 없이 적용할 수 있게 했다."],
  ["파급","[[pi05]]에서 상위 계층의 이산 서브골 표현으로 쓰이고, [[knowledge-insulation]]에서는 백본을 파인튜닝하는 대체 학습 신호로 쓰인다. 후속 [[faster]]는 DCT 대신 학습된 신경 토크나이저로 같은 문제를 다시 공략한다."]],
 see:["pi05","knowledge-insulation","faster","openvla"]},

{s:"openvla-oft",t:"vla",n:"OpenVLA-OFT",full:"Fine-Tuning Vision-Language-Action Models: Optimizing Speed and Success",org:"Stanford",d:"2025-02",aid:"arXiv:2502.19645",venue:"arXiv 프리프린트",
 lead:"OpenVLA의 파인튜닝 설계 공간을 체계적으로 훑어 추론 속도와 성공률을 함께 끌어올린 연구.",
 body:[
  ["핵심 아이디어","세 가지 설계 선택이 결정적이라는 것을 실험으로 분리했다. 자기회귀 디코딩 대신 병렬 디코딩, 단일 스텝 대신 액션 청킹, 그리고 이산 토큰 대신 연속 액션 헤드다. 이 셋을 함께 적용하면 추론 처리량이 수십 배 개선된다."],
  ["기여","이산 자기회귀 VLA가 3~5Hz에 머문다는 진단의 표준 인용원이 되었다. 이후 촉각·안전 계열 논문들이 백본으로 삼는 강한 기준선이기도 하다([[vitar]], [[probeact]])."]],
 see:["openvla","fast","vitar","probeact"]},

{s:"conrft",t:"vla",n:"ConRFT",full:"ConRFT: A Reinforced Fine-tuning Method for VLA Models via Consistency Policy",org:"중국과학원 자동화연구소",d:"2025-02",aid:"arXiv:2502.05450",venue:"arXiv 프리프린트",src:"abs",
 lead:"일관성 정책을 활용한 VLA 강화 파인튜닝. VLA 사후학습 RL 계열의 초기 사례 중 하나다.",
 body:[
  ["핵심 아이디어","확산 정책을 실로봇 RL로 파인튜닝할 때의 난점은 다단계 디노이징 때문에 정책의 로그 확률을 다루기 어렵다는 것이다. 일관성 정책은 이를 소수 스텝으로 압축해 가치 기반 업데이트를 가능하게 만든다. 오프라인 단계에서 행동 복제와 Q 학습을 결합해 안정적 초기화를 얻고, 온라인 단계에서 사람의 개입을 섞어 실로봇에서 미세조정한다."],
  ["위치","[[pistar06]]이 훨씬 큰 규모로 정식화하는 문제, 즉 소량의 실배치 경험으로 모방학습 정책을 넘어서는 문제를 앞서 다뤘다."]],
 see:["pistar06","pirl","reinflow"]},

{s:"safevla",t:"vla",n:"SafeVLA",full:"SafeVLA: Towards Safety Alignment of Vision-Language-Action Model via Constrained Learning",org:"북경대 외",d:"2025-03",aid:"arXiv:2503.03480",venue:"NeurIPS 2025 spotlight",key:1,
 lead:"제약 마르코프 결정과정 틀에서 안전 제약을 VLA 학습에 명시적으로 통합한 연구. 안전 위반 누적 비용을 83.58% 줄였다고 보고했다.",
 body:[
  ["핵심 아이디어","안전을 보상 항에 섞어 넣는 대신 제약으로 분리한다. CMDP 정식화에서는 과제 성능을 최대화하되 안전 비용의 기댓값이 임계값을 넘지 않도록 하는데, 이렇게 하면 안전과 성능의 교환비를 가중치 튜닝이 아니라 제약 수준으로 직접 지정할 수 있다."],
  ["통합 안전 접근(ISA)","네 단계로 구성된다. 안전 요구사항을 모델링하고, 다양한 불안전 행동을 능동적으로 유도해 드러내고, 안전 강화학습으로 정책을 제약하고, 표적 평가로 검증한다. 유도된 위험에 대해 min-max 관점으로 최적화한다는 점에서 적대적 요소가 들어 있다."],
  ["결과와 한계","성능 손실 없이 안전 위반 누적 비용을 83.58% 줄였다고 보고했다. 다만 이는 통계적 개선이지 보증이 아니며, [[vla-arena]]는 현행 VLA 다수가 안전 제약을 아예 고려하지 않는다는 것을 별도로 실측했다. 학습된 정책에 대한 형식 검증은 여전히 열려 있다."]],
 see:["probeact","vla-arena","open-problems"]},

{s:"groot-n1",t:"vla",n:"GR00T N1",full:"GR00T N1: An Open Foundation Model for Generalist Humanoid Robots",org:"NVIDIA",d:"2025-03",aid:"arXiv:2503.14734",venue:"arXiv 프리프린트",
 lead:"휴머노이드를 겨냥한 오픈 파운데이션 모델. 이후 N1.5, 상용 라이선스가 붙은 N1.7을 거쳐 [[groot-n2]]로 이어진다.",
 body:[
  ["핵심 아이디어","이중 시스템 구조를 명시적으로 채택했다. 시각-언어 모듈이 느린 속도로 환경을 해석하고 계획하며, 확산 트랜스포머 기반 액션 모듈이 빠른 속도로 연속 동작을 생성한다. 두 모듈은 끝단까지 함께 학습된다."],
  ["데이터 피라미드","실제 로봇 궤적, 시뮬레이션에서 생성한 합성 데이터, 인터넷 규모 인간 영상을 층위로 쌓아 학습한다. 소수의 실제 데모에서 대량의 합성 모션 데이터를 만드는 블루프린트를 함께 제공한 것이 이 계열의 특징이다."],
  ["플랫폼 전략","모델 단독이 아니라 시뮬레이션 스택(Isaac Lab), 물리 엔진(Newton), 미들웨어(Isaac ROS), 온보드 추론 하드웨어(Jetson Thor)와 묶여 배포된다. 데이터 부족 문제를 연산 문제로 치환하려는 접근이 일관되게 깔려 있다."]],
 see:["groot-n2","dreamzero","oxe"]},

{s:"pi05",t:"vla",n:"π0.5",full:"π0.5: a Vision-Language-Action Model with Open-World Generalization",org:"Physical Intelligence",d:"2025-04",aid:"arXiv:2504.16054",venue:"CoRL 2025",key:1,
 lead:"실제 가정 환경 배치를 목표로 한 π 계열의 두 번째 세대. 이산 상위 계층과 연속 하위 계층의 이중 구조를 명시적으로 채택했다.",
 body:[
  ["핵심 아이디어","서로 다른 시간 스케일을 서로 다른 표현에 맡긴다. 상위 계층은 [[fast]] 토크나이저로 학습된 이산 토큰으로 다음에 무엇을 할지를 서브골 수준에서 표현하고, 하위 flow matching 계층이 그 토큰을 조건으로 고주파 연속 제어를 만든다. 이산 표현이 의미 추론에 적합하고 연속 표현이 운동 생성에 적합하다는 관찰을 구조에 반영한 것이다."],
  ["이종 데이터 공동 학습","로봇 데모만이 아니라 웹 데이터, 다른 로봇의 데이터, 언어 서브태스크 주석, 고수준 예측 과제를 함께 섞어 학습한다. 저자들의 주장은 일반화의 원천이 로봇 데이터 규모가 아니라 학습 소스의 이질성이라는 것이다."],
  ["평가","학습에서 본 적 없는 실제 가정에서 청소, 정리 같은 장시간 과제를 수행한 결과를 보고했다. 다만 이런 실환경 평가의 재현성 문제는 [[roboarena]]와 [[robotarena-inf]]가 별도로 제기하는 주제다."]],
 see:["pi0","fast","pistar06","pi07","roboarena"]},

{s:"knowledge-insulation",t:"vla",n:"Knowledge Insulation",full:"Knowledge Insulating Vision-Language-Action Models: Train Fast, Run Fast, Generalize Better",org:"Physical Intelligence",d:"2025-05",aid:"arXiv:2505.23705",venue:"ICLR 2026",key:1,
 lead:"연속 action expert를 VLM에 그대로 붙이면 학습 속도와 지식 전이가 모두 손상된다는 것을 실증하고, 백본으로의 그래디언트 역전파를 차단하는 학습 레시피를 제안했다.",
 body:[
  ["문제","action expert는 사전학습되지 않은 새 파라미터다. 학습 초기에 이 모듈이 만들어내는 그래디언트는 사실상 잡음인데, 이것이 백본으로 역전파되면 사전학습된 시각-언어 표현이 훼손된다. 그 결과 언어 지시 해석 능력이 떨어지고 최종 정책 성능도 함께 나빠진다. 저자들은 이를 단순한 학습 불안정이 아니라 지식 파괴로 규정했다."],
  ["핵심 아이디어","백본과 action expert를 서로 다른 신호로 학습시키고 그 사이를 절연한다. 백본은 [[fast]]로 인코딩한 이산 액션 토큰을 next-token prediction으로 학습해 사전학습 때와 같은 형태의 손실만 받는다. action expert는 연속 액션을 flow matching으로 학습하되, 그 그래디언트는 백본으로 흘러가지 않는다. 이산 토큰이 초기화되지 않은 가중치의 영향을 받지 않는 대체 학습 신호 역할을 한다."],
  ["효과","학습 속도, 추론 속도, 일반화가 동시에 개선된다는 것이 논문 제목의 세 항목이다. 이 레시피는 [[pi07]]까지 그대로 이어지며, VLA에서 백본과 액션 헤드를 어떻게 결합할 것인가에 대한 사실상의 표준이 되었다."]],
 see:["pi0","fast","pi07","pi05"]},

{s:"reinflow",t:"vla",n:"ReinFlow",full:"ReinFlow: Fine-tuning Flow Matching Policy with Online Reinforcement Learning",org:"칭화대",d:"2025-05",aid:"arXiv:2505.22094",venue:"arXiv 프리프린트",src:"abs",
 lead:"flow matching 정책을 온라인 강화학습으로 파인튜닝하는 기법.",
 body:[
  ["핵심 아이디어","flow matching 정책은 결정적 상미분방정식을 적분해 액션을 만들기 때문에 확률적 정책 그래디언트를 그대로 적용할 수 없다. 결정적 흐름에 학습 가능한 잡음을 주입해 이산화된 마르코프 과정으로 바꾸면 로그 확률을 다룰 수 있게 되고, 표준 정책 그래디언트 계열을 쓸 수 있다."],
  ["위치","[[pirl]], [[conrft]]와 함께 flow·확산 정책의 RL 파인튜닝이라는 공통 문제를 각각 다른 방식으로 우회한다."]],
 see:["pirl","conrft","pistar06"]},

{s:"pirl",t:"vla",n:"π_RL",full:"π_RL: Online RL Fine-tuning for Flow-based Vision-Language-Action Models",org:"칭화대 외",d:"2025-10",aid:"arXiv:2510.25889",venue:"arXiv 프리프린트",src:"abs",
 lead:"flow 기반 VLA에 대한 온라인 강화학습 파인튜닝 프레임워크.",
 body:[
  ["핵심 아이디어","대규모 병렬 시뮬레이션에서 flow 기반 VLA를 온라인으로 파인튜닝한다. 다단계 흐름 적분의 로그 확률 문제를 우회하는 두 가지 알고리즘을 제시하고, 소수 데모로 학습된 정책이 RL 파인튜닝으로 크게 개선된다는 것을 보인다."],
  ["위치","2026년 VLA 사후학습 RL 흐름에서 시뮬레이션 기반 축을 대표한다. 실배치 데이터를 쓰는 [[pistar06]]과 대비된다."]],
 see:["pistar06","reinflow","z1"]},

{s:"pistar06",t:"vla",n:"π*0.6 / RECAP",full:"π*0.6: a VLA That Learns From Experience",org:"Physical Intelligence",d:"2025-11",aid:"arXiv:2511.14759",venue:"arXiv 프리프린트",key:1,
 lead:"모방학습의 오차 누적 문제를 실배치 강화학습으로 다룬 연구. advantage conditioning을 통해 데모, 자율 수집 데이터, 전문가의 실시간 개입 교정을 하나의 학습 신호로 통합한다.",
 body:[
  ["문제","모방학습 정책은 자신이 실제로 저지르는 실수를 데이터에서 본 적이 없다. 작은 오차가 분포 밖 상태로 밀어내고 거기서 더 큰 오차가 나오는 누적 구조 때문에, 데모를 아무리 늘려도 실사용 신뢰도에 도달하지 못한다. 저자들의 표현으로는 모델도 사람처럼 숙련에 이르려면 연습이 필요하다."],
  ["핵심 아이디어 — advantage conditioning","나쁜 데이터를 버리지 않고 라벨을 붙여 쓴다. 좋은 행동과 나쁜 행동을 모두 학습에 포함시키되, 각 행동의 이점(advantage)을 조건 입력으로 함께 준다. 모델은 어떤 이점 값에 대응하는 행동인지를 배우고, 실행 시에는 높은 이점을 지정해 조건화함으로써 학습 데이터 자체보다 나은 정책을 얻는다. 데이터를 버리지 않으므로 대규모 학습에서의 일반화 이점을 유지한다는 것이 설계 근거다."],
  ["세 가지 데이터원","데모(초기 능력), 자율 실행 중 사람이 개입해 고쳐준 교정(실패 지점의 밀집 신호), 그리고 자율 수집 경험(온폴리시 분포)을 모두 같은 틀에서 흡수한다. 사람의 개입을 별도 알고리즘 없이 이점 신호로 환산해 쓴다는 점이 실용적 기여다."],
  ["파이프라인","오프라인 RL로 generalist를 사전학습해 π*0.6을 얻고, 이를 다운스트림 과제에 온로봇 데이터 수집으로 특화시킨다."],
  ["보고된 결과","가장 어려운 과제에서 처리량 2배 이상, 실패율 2배 이상 감소. 실증 과제는 에스프레소 제조, 골판지 박스 조립, 다양한 종류의 세탁물 접기이며, 각각 재료의 변동성이 큰 과제로 선택되었다."],
  ["저자들이 남긴 한계","VLA를 실사용 신뢰도까지 끌어올리는 가장 직접적인 경로가 RL로 보이지만, 대용량 모델의 대규모 RL 학습 안정성, 표본 복잡도, 자율성, 지연된 피드백이 모두 미해결이며 LLM용 RL 프레임워크는 출발점 정도만 제공한다고 명시했다."]],
 see:["pi05","pi07","pirl","z1","open-problems"]},

{s:"open-challenges",t:"vla",n:"10 Open Challenges",full:"10 Open Challenges Steering the Future of Vision-Language-Action Models",org:"NTU · SUTD · NUS · Stanford 외",d:"2025-11",aid:"arXiv:2511.05936",venue:"AAAI 2026",key:1,
 lead:"VLA 연구의 미해결 과제를 열 갈래로 정리한 문헌. 이 위키의 미해결 문제 문서에서 가장 자주 인용하는 근거다.",
 body:[
  ["열 가지 과제","멀티모달 감각과 인식, 견고한 추론, 양질의 학습 데이터, 평가, cross-robot 액션 일반화, 자원 효율, 전신 협응, 안전 보증, 에이전트 프레임워크, 인간-로봇 협조."],
  ["가장 자주 인용되는 절","이산 액션 모델과 연속 액션 모델의 트레이드오프 정리다. 이산 표현은 트랜스포머로 구현이 단순하지만 양자화 오차가 있고 3~5Hz 수준의 추론 속도 때문에 고주파 제어와 양팔 조작에 부적합하며, 연속 표현은 운동 충실도가 높고 고주파 제어에 맞지만 수렴 연산 예산이 훨씬 크다. 그래서 이산 사전학습 후 action expert를 붙이는 하이브리드가 우세해졌다는 것이 저자들의 정리다."],
  ["깊이 인식 문제","대부분의 VLA가 RGB만 보고 3차원을 다루려 한다. 시간축 프레임 비교로 깊이를 근사할 수 있지만 물체 크기, 카메라 거리, 동작의 미세함에 따라 민감도가 떨어진다. MolmoAct와 SpatialVLA가 깊이를 쓰지만 학습 단계에서 RGB로부터 깊이를 추정하도록 배우는 방식이라 한계가 남는다는 지적이다."],
  ["제안 방향","계층적 계획, 깊이 기반 공간 이해 보강, 범용 액션 표현, 세계 동역학 모델링, 생성 모델 기반 데이터 합성, 사후학습. 특히 전신 협응 절에서 해석적 구조와 학습 유연성을 결합하는 하이브리드 제어를 유력한 경로로 꼽은 대목이 이 위키의 미해결 문제 12번 항목의 간접 근거다."]],
 see:["open-problems","vla-arena","dreamzero","vjepa2"]},

{s:"faster",t:"vla",n:"FASTer",full:"FASTer: Toward Efficient Autoregressive VLA Modeling via Neural Action Tokenization",org:"—",d:"2025-12",aid:"arXiv:2512.04952",venue:"arXiv 프리프린트",src:"abs",
 lead:"[[fast]]의 DCT 기반 변환을 학습된 신경 토크나이저로 대체해 자기회귀 VLA의 효율을 더 끌어올린 후속 연구.",
 body:[
  ["핵심 아이디어","DCT는 고정된 변환이라 로봇·과제별 액션 구조를 반영하지 못한다. VQ 계열의 신경 토크나이저(FASTerVQ)를 학습하면 데이터에 맞춘 코드북을 얻을 수 있다."],
  ["보고된 위치","LIBERO 평균 97.9%, Simpler-Bridge 평균 87.9%로 π0-FAST 계열과 OpenVLA-OFT를 상회하는 수치를 자체 비교표에 제시했다. 서로 다른 논문의 벤치마크 수치이므로 직접 비교에는 주의가 필요하다."]],
 see:["fast","openvla-oft","pi0"]},

{s:"tafvla",t:"vla",n:"TaF-VLA",full:"Tactile-Force Alignment in Vision-Language-Action Models for Force-aware Manipulation",org:"—",d:"2026-01",aid:"arXiv:2601.20321",venue:"arXiv 프리프린트",src:"abs",
 lead:"촉각과 힘을 정렬한 토큰을 언어-액션 스트림에 끼워 넣어 힘 인식 조작을 수행한다.",
 body:[
  ["핵심 아이디어","촉각 이미지를 그대로 인코딩하면 정적인 표면 질감을 학습하기 쉽다. 촉각 신호를 손목 힘·토크와 정렬시켜 학습하면, 표현이 질감이 아니라 이력 의존적이고 잡음에 둔감한 물리 동역학을 담게 된다는 것이 이 논문의 주장이다."],
  ["구조","정렬된 촉각-힘 인코더의 출력 토큰을 사전학습 VLA의 언어-액션 토큰 스트림 사이에 끼워 넣어, 모델이 언어와 촉각 단서를 동시에 조건으로 삼아 엔드이펙터 동작을 결정하게 한다."],
  ["결과","힘이 중요한 일상 과제 7종에서 기존 시각-촉각 정렬 기준선 대비 평균 22% 성공률 개선을 보고했다."]],
 see:["forcevla2","vitar","ftp1","tacforesight"]},

{s:"craft",t:"vla",n:"CRAFT",full:"CRAFT: Adapting VLA Models to Contact-rich Manipulation via Force-aware Curriculum Fine-tuning",org:"—",d:"2026-02",aid:"arXiv:2602.12532",venue:"arXiv 프리프린트",src:"abs",
 lead:"시각·언어 임베딩의 정보량을 인위적으로 조절해, 학습 초기에 모델이 힘 모달리티를 먼저 붙잡게 만드는 커리큘럼 파인튜닝.",
 body:[
  ["문제 진단","힘이나 토크는 시각·언어에 비해 정보 엔트로피가 낮은 신호다. 세 모달리티를 그냥 함께 넣으면 모델이 정보량이 풍부한 시각에 의존해버려 힘 신호가 사실상 무시된다."],
  ["핵심 아이디어","시각·언어 임베딩 뒤에 변분 정보 병목을 넣어 초기 학습 단계에서 그 정보량을 억제한다. 모델이 힘 모달리티를 우선 활용하도록 강제한 뒤, 병목을 점진적으로 완화해 시각·언어 기여를 회복시킨다. 저자들은 이 메커니즘이 관절 토크뿐 아니라 촉각 등 저엔트로피 고중요도 모달리티 일반에 적용된다고 본다."],
  ["평가","USB 삽입, 카톤 뒤집기, 화이트보드 닦기, 점토 밀기 등 접촉이 지배적인 실기 과제로 검증했다."]],
 see:["tafvla","forcevla2","atvla"]},

{s:"tacvla",t:"vla",n:"TacVLA",full:"TacVLA: Contact-aware Tactile Fusion for Robust VLA Manipulation",org:"—",d:"2026-03",aid:"arXiv:2603.12665",venue:"arXiv 프리프린트",src:"abs",
 lead:"접촉 상태를 인식해 촉각 정보의 융합 방식을 조절하는 VLA.",
 body:[
  ["핵심 아이디어","촉각은 접촉 중일 때만 유효한 신호다. 접촉 여부와 무관하게 항상 같은 방식으로 융합하면 비접촉 구간에서 잡음을 주입하는 셈이 된다. 접촉 상태를 명시적으로 판별해 융합 강도를 조절하는 것이 이 계열 논문들의 공통 착상이며, [[atvla]]도 같은 문제를 다른 방식으로 다룬다."]],
 see:["tafvla","atvla","ftp1"]},

{s:"forcevla2",t:"vla",n:"ForceVLA2",full:"ForceVLA2: Unleashing Hybrid Force-Position Control with Force Awareness",org:"—",d:"2026-03",aid:"arXiv:2603.15169",venue:"arXiv 프리프린트",src:"abs",
 lead:"힘 인식 전문가 혼합 구조와 힘-위치 하이브리드 제어를 결합한 후속 연구. 선행 ForceVLA는 NeurIPS에 게재되었다.",
 body:[
  ["핵심 아이디어","VLA의 출력을 위치 명령으로만 두지 않고 힘-위치 하이브리드 제어 명령으로 확장한다. 어느 축을 위치로 제어하고 어느 축을 힘으로 제어할지를 상황에 따라 바꾸는 것이 접촉 과제의 고전적 해법인데, 이를 학습 정책이 스스로 결정하게 만든 것이 기여다."],
  ["구조","힘 정보를 조건으로 전문가를 선택하는 MoE 모듈을 액션 헤드에 넣어, 접촉 국면별로 다른 전문가가 활성화되도록 한다."]],
 see:["tafvla","craft","tacforesight"]},

{s:"snapflow",t:"vla",n:"SnapFlow",full:"SnapFlow: One-step Action Generation for Flow-matching VLAs via Progressive Self-distillation",org:"—",d:"2026-04",aid:"arXiv:2604.05656",venue:"arXiv 프리프린트",src:"abs",
 lead:"점진적 자기증류로 flow matching VLA의 액션 생성을 1스텝으로 압축한다.",
 body:[
  ["핵심 아이디어","flow matching은 확산보다 적분 스텝이 적지만 여전히 여러 번의 순전파를 요구한다. 다단계 흐름의 결과를 스스로 교사 삼아 점진적으로 스텝 수를 반으로 줄여 나가면, 최종적으로 한 번의 순전파로 같은 액션 청크를 얻는다."],
  ["같은 계열","ManiFlow의 일관성 flow 학습, MP1의 MeanFlow 기반 1스텝 정책이 같은 목표를 다른 증류 방식으로 공략한다. 이 축은 미해결 문제 중 온보드 자원 제약과 직접 맞닿아 있다."]],
 see:["pi0","open-challenges","open-problems"]},

{s:"pi07",t:"vla",n:"π0.7",full:"π0.7: a Steerable Generalist Robotic Foundation Model with Emergent Capabilities",org:"Physical Intelligence",d:"2026-04",aid:"arXiv:2604.15483",venue:"arXiv 프리프린트",key:1,
 lead:"π 계열의 최신 세대. 무엇을 할지뿐 아니라 어떤 방식과 전략으로 할지를 프롬프트에 담는 다양한 컨텍스트 조건화를 핵심 아이디어로 삼는다.",
 body:[
  ["문제의식","generalist 모델은 크고 다양한 데이터에서 능력이 창발한다는 원리 위에 서 있다. 그런데 로봇 정책에서는 데이터가 다양해질수록 같은 지시에 대해 여러 전략이 섞여 들어가 모델이 어느 쪽으로도 확실히 가지 않는 문제가 생긴다. 조종 가능성을 잃는 것이다."],
  ["핵심 아이디어 — 다양한 컨텍스트 조건화","학습 시 모델을 언어 명령만이 아니라 그 행동이 수행된 맥락 전체로 조건화한다. 서브골 이미지, 전략 서술, 수행 방식에 대한 부가 정보가 프롬프트에 함께 들어간다. 그러면 데이터의 다양성이 모호성이 아니라 조건부 분포의 폭으로 흡수되고, 배치 시에는 프롬프트만 바꿔 같은 과제를 다른 전략으로 수행시킬 수 있다."],
  ["학습 데이터","데모뿐 아니라 실패를 포함한 준최적 자율 데이터, 그리고 비로봇 출처 데이터를 함께 섞는다. [[pistar06]] 계열이 축적한 자율 데이터를 재활용하는 구조이며, 학습 레시피는 [[knowledge-insulation]]을 따른다."],
  ["보고된 능력","미지 환경에서 여러 주방 기기를 다루는 다단계 지시 수행, 학습에서 본 적 없는 로봇으로 세탁물을 접는 zero-shot cross-embodiment 일반화, 그리고 에스프레소 머신 조작에서 RL로 특화된 전문 모델과 대등한 out-of-the-box 성능. 마지막 항목은 특화 모델 없이도 같은 수준에 도달할 수 있다는 주장이라 특히 눈에 띈다."],
  ["평가 시 유의점","제시된 수치는 자체 평가이며 독립 재현이 없다. cross-embodiment 주장에 대해서는 [[robotarena-inf]]의 상반된 실측을 함께 볼 필요가 있다."]],
 see:["pi05","pistar06","knowledge-insulation","robotarena-inf","mem"]},

{s:"atvla",t:"vla",n:"AT-VLA",full:"AT-VLA: Adaptive Tactile Injection for Enhanced Feedback Reaction",org:"—",d:"2026-05",aid:"arXiv:2605.07308",venue:"arXiv 프리프린트",src:"abs",
 lead:"사전학습 지식과 새로 주입되는 촉각 피드백 사이의 균형을 관리해, 비접촉 단계의 시각 성능을 훼손하지 않으면서 접촉 단계 반응성을 확보한다.",
 body:[
  ["핵심 아이디어","촉각의 의미를 모델이 해석하게 만드는 데 집중하는 접근은 원래의 시각 인식 능력을 해칠 수 있다. 이 논문은 촉각 주입의 강도를 적응적으로 조절해 사전학습 지식과의 균형을 유지하는 쪽을 택한다."],
  ["결과","지퍼에 걸리거나 표면 돌출부에 막히는 등 기존 정책의 전형적 실패 양상을 접촉 국면에서 줄였다고 보고했다. VTLA, Reactive Diffusion Policy 같은 촉각 정책과 비교했다."]],
 see:["tafvla","tacvla","vitar"]},

{s:"probeact",t:"vla",n:"ProbeAct",full:"ProbeAct: Probe-Guided Training-Free Failure Recovery in VLA Models",org:"—",d:"2026-06",aid:"arXiv:2606.09740",venue:"arXiv 프리프린트",key:1,
 lead:"학습이 필요 없는 플러그앤플레이 안전망. 은닉 상태 프로브, 기구학 기반 실패 감지 상태 기계, 계층적 제어 장벽 함수 필터의 세 요소로 구성된다.",
 body:[
  ["핵심 아이디어","VLA를 다시 학습시키지 않고 그 내부 표현을 읽어내 쓴다. 정책의 중간 은닉 상태에는 이미 물체 위치 정보가 들어 있으므로, 경량 프로브만 얹으면 별도 인식 모듈 없이 3차원 위치를 추정할 수 있다는 것이다."],
  ["세 구성 요소","첫째, 과제 관련 물체의 3차원 위치를 예측하는 다중 표적 프로브와 헝가리안 매칭 기반 정체성 추적으로 다물체 장면을 다룬다. 둘째, 그리퍼 내부 신호와 엔드이펙터 기구학만으로 파지·이송·배치 실패를 감지하는 물체 무관 상태 기계를 둔다. 셋째, 반복 실패가 일어난 위치를 소프트 안전집합 제약으로 인코딩해 VLA 액션을 최소 침습으로 교정하는 계층적 CBF 필터를 적용한다."],
  ["결과","LIBERO-plus에서 OpenVLA-OFT의 성공률을 69.6%에서 74.1%로 올렸다. 학습 파이프라인과 직교하므로 베이스 모델과 파인튜닝 모델 양쪽에 붙는다."],
  ["위치","학습 정책 위에 제어 이론적 안전 계층을 사후에 얹는 접근의 대표 사례다. 미해결 문제 중 학습과 최적화 계층의 인터페이스 항목에서 세 가지 결합 방식 중 하나로 다시 다룬다."]],
 see:["safevla","openvla-oft","open-problems"]},

{s:"ftp1",t:"vla",n:"FTP-1",full:"FTP-1: A Generalist Foundation Tactile Policy Across Tactile Sensors",org:"—",d:"2026-06",aid:"arXiv:2606.13102",venue:"arXiv 프리프린트",key:1,
 lead:"서로 다른 촉각 센서를 가로질러 동작하는 일반 촉각 정책. 촉각 하드웨어의 이질성을 정면 목표로 삼은 드문 시도다.",
 body:[
  ["문제 설정","촉각 계열 연구 대부분이 특정 센서와 특정 과제군에 묶여 있다. 광학식, 저항막식, 압전식이 서로 다른 물리량을 다른 해상도로 내보내므로 센서를 바꾸면 정책을 다시 학습해야 한다. 이 표준화 부재가 촉각을 대규모 사전학습 코퍼스에 편입시키지 못하는 실질적 이유 중 하나다."],
  ["핵심 아이디어","센서별 원시 신호를 공통 표현으로 사영한 뒤 그 위에서 정책을 학습한다. 시각 분야의 백본 사전학습이 카메라 기종에 무관하듯, 촉각에도 센서 무관 표현층이 필요하다는 발상이다."],
  ["위치","같은 시기 촉각 VLA 논문들이 개별 성능을 겨루는 동안 이 논문은 일반화의 축을 센서 쪽에 두었다. 미해결 문제 1번 항목에서 남은 과제로 지목한 세 가지 중 하나에 직접 대응한다."]],
 see:["tafvla","tacforesight","tacvla","open-problems"]},

{s:"tacforesight",t:"vla",n:"TacForeSight",full:"TacForeSight: Force-Guided Tactile World Model for Contact-Rich Manipulation",org:"—",d:"2026-06",aid:"arXiv:2606.11184",venue:"arXiv 프리프린트",src:"abs",
 lead:"손목 힘·토크 신호로 촉각 잠재 예측을 조건화한다. 반응적 특징 융합에서 예측적 패러다임으로 넘어가려는 시도다.",
 body:[
  ["핵심 아이디어","기존 촉각 정책은 이미 발생한 접촉을 읽어 반응한다. 이 논문은 촉각의 미래 잠재 상태를 예측하게 만들어 예측적 물리 추론을 정책에 넣는다. 관건은 조건 신호인데, 손목의 전역 힘·토크 변화와 손끝의 국소 촉각 변화 사이에 비대칭적 인과 관계가 있다는 관찰을 이용해 전자로 후자를 조건화한다."],
  ["효과","잠재 공간에서 촉각을 예측하는 방식이 실시간 접촉 제어에 쓸 만큼 가볍다는 것을 보였다. 접촉 조절과 외란 복구 실험으로 검증했다."],
  ["위치","월드 모델의 착상을 촉각 채널에 국소적으로 적용한 사례로, [[dreamzero]] 계열의 영상 기반 월드 모델과 대비된다."]],
 see:["ftp1","tafvla","dreamzero"]},

{s:"z1",t:"vla",n:"Z-1",full:"Z-1: Efficient Reinforcement Learning for Vision-Language-Action Models",org:"—",d:"2026-06",aid:"arXiv:2606.31846",venue:"arXiv 프리프린트",src:"abs",
 lead:"VLA 강화학습의 표본 효율과 연산 효율을 개선하려는 연구.",
 body:[
  ["핵심 아이디어","[[pistar06]]이 남긴 미해결 목록 중 표본 복잡도 항목을 겨냥한다. 대용량 VLA의 RL은 롤아웃 비용이 지배적이라, 같은 성능에 도달하는 데 필요한 실행 횟수를 줄이는 것이 곧 실용성이다."],
  ["위치","π0.6/0.7 계열, [[pirl]], [[reinflow]]와 함께 2026년 VLA 사후학습 RL 지형을 이룬다."]],
 see:["pistar06","pirl","reinflow"]},

{s:"gemini-robotics-2",t:"vla",n:"Gemini Robotics 2",full:"Gemini Robotics 2 (VLA · ER 2 · On-Device 2)",org:"Google DeepMind",d:"2026-07",aid:"릴리스 (논문 미공개)",venue:"공식 블로그 · 모델 카드",key:1,
 lead:"2026년 7월 30일 공개된 Google DeepMind의 로봇 모델 묶음. 이전 세대가 주로 상체 조작을 다뤘던 데 비해 발끝에서 손끝까지의 전신 제어를 목표로 한다.",
 body:[
  ["세 모델의 역할 분담","본체 Gemini Robotics 2는 시각·언어 입력을 모터 제어로 변환하는 VLA로, 전신 휴머노이드와 양팔 로봇을 모두 구동한다. Gemini Robotics ER 2는 임베디드 추론 모델로 인간과의 소통, 물리 세계 이해, 수 분 길이의 다단계 계획, 여러 로봇의 협업을 담당한다. On-Device 2는 로컬 실행에 최적화된 버전으로 수 시간 분량 데이터로 새 embodiment에 적응한다고 밝혔다."],
  ["핵심 주장 — 하나의 체크포인트, 여러 몸","Apptronik Apollo 2에 SharpaWave 손을 붙인 구성, 같은 로봇에 Inspire 손을 붙인 구성, 그리고 Franka Duo에 Robotiq 그리퍼를 붙인 구성을 동일 체크포인트로 구동한 결과를 공개했다. 상체 조작과 이동을 별도 정책으로 나누지 않고 하나의 학습 정책이 다리, 몸통, 팔, 손가락을 함께 제어한다는 것이 전신 제어의 의미다."],
  ["시연","물뿌리개를 아래 선반의 초록 통에 넣으라는 지시에 로봇이 방을 가로질러 걸어가 물체를 집어 옮기는 장면이 대표 예시다. 이동과 조작이 하나의 지시 아래 이어진다는 점이 이전 세대와 다르다."],
  ["공개된 한계","DeepMind 자신의 보고에 따르면 전신 과제와 그리퍼 기반 정밀 조작에서는 중간에서 높은 성공률을 얻었지만, 다지 손 기반 정밀 조작은 여전히 어렵다. 산업계 릴리스가 스스로 남긴 이 진술은 이 위키의 미해결 문제 1번과 10번 항목에서 근거로 쓰인다."],
  ["접근성","전신 모델과 온디바이스 모델은 조기 접근 파트너에게만 제공되고 ER 2만 제한적으로 열려 있다. 논문 형태의 상세 평가는 공개되지 않았으며, 여기 정리된 내용은 공식 블로그와 모델 카드에 근거한다."]],
 see:["groot-n2","pi07","open-problems"]},

{s:"vitar",t:"vla",n:"ViTaR",full:"ViTaR: Visuo-Tactile Residual Adaptation for Foundation VLA Manipulation",org:"—",d:"2026-08",aid:"arXiv:2608.15816",venue:"arXiv 프리프린트",src:"abs",
 lead:"동결된 파운데이션 VLA 위에 시각-촉각 잔차를 학습해 접촉 과제 성능을 끌어올린다.",
 body:[
  ["핵심 아이디어","파운데이션 VLA의 시각-의미 사전지식을 훼손하지 않으려면 백본을 건드리지 않는 편이 낫다. 동결한 채로 촉각 조건 잔차만 학습해 원래 출력에 더하는 구조를 택했다."],
  ["학습 신호","전역 보상 모델 대신 국소 비교를 쓴다. 복원 가능한 결정 지점에서 분기시켜 어느 교정이 국소적으로 더 나은지를 순위로 학습한다. 에피소드 전체를 비교하는 기존 선호 학습과 달리 상태 내부의 효과 순위를 배운다는 점이 차별점이다."],
  ["결과","UniVTAC 벤치마크 7개 접촉 과제 평균 61.3%로, 동결 [[openvla-oft]] 기준 대비 30.6퍼센트포인트 개선을 보고했다."]],
 see:["openvla-oft","tafvla","ftp1"]},
/* ───────── RFM · World Model ───────── */
{s:"gr2",t:"rfm",n:"GR-2",full:"GR-2: A Generative Video-Language-Action Model with Web-Scale Knowledge",org:"ByteDance Research",d:"2024-10",aid:"arXiv:2410.06158",venue:"arXiv 프리프린트",src:"abs",
 lead:"인터넷 영상으로 사전학습한 뒤 로봇 데이터로 파인튜닝하는 생성형 video-language-action 모델.",
 body:[
  ["핵심 아이디어","먼저 대량의 인터넷 영상에서 다음 프레임을 예측하도록 학습해 세계의 동역학을 익히고, 그 다음 로봇 궤적으로 파인튜닝해 영상 예측과 액션 예측을 함께 수행하게 만든다. 액션을 생성하기 전에 미래 영상을 먼저 그리는 구조라 예측이 정책의 조건이 된다."],
  ["위치","이 발상이 2026년의 world action model 계열([[dreamzero]], [[fastwam]])로 확장된다. GR-2 시점에서는 영상 예측이 보조 목적이었지만, 이후에는 예측 자체가 정책의 본체가 된다."]],
 see:["dreamzero","lapa","fastwam"]},

{s:"lapa",t:"rfm",n:"LAPA",full:"Latent Action Pretraining from Videos",org:"KAIST · Washington 외",d:"2024-10",aid:"arXiv:2410.11758",venue:"ICLR 2025",key:1,
 lead:"액션 라벨이 없는 영상에서 잠재 액션을 추출해 정책을 사전학습하는 방법. latent action 계열의 출발점으로 널리 인용된다.",
 body:[
  ["문제","로봇 데이터의 병목은 영상이 아니라 액션 라벨이다. 인터넷에는 사람이 물건을 다루는 영상이 무한히 있지만 관절 명령이 붙어 있지 않다. 그렇다고 액션 없이 영상만 학습하면 정책이 되지 않는다."],
  ["핵심 아이디어","액션을 관측 가능한 양이 아니라 잠재 변수로 둔다. 연속한 두 프레임으로부터 그 사이에 무슨 일이 일어났는지를 이산 잠재 코드로 추론하는 인코더를 학습하고, 동시에 그 코드로 다음 프레임을 예측하는 디코더를 학습한다. 재구성 손실만으로 학습되므로 액션 주석이 필요 없다. 이렇게 얻은 잠재 액션을 예측하도록 VLM을 사전학습한 뒤, 소량의 실제 로봇 데이터로 잠재 코드와 실제 관절 명령을 정렬한다."],
  ["기여","액션 라벨이 없는 인간 영상만으로 사전학습한 정책이 로봇 데이터로 사전학습한 정책을 일부 조건에서 앞선다는 결과를 보고했다. 데이터 병목을 우회하는 경로가 실제로 존재한다는 초기 증거다."],
  ["계승","[[agibot-go1]]의 latent action planner, [[comov]], [[being-h07]]이 같은 착상을 다르게 구현한다. 잠재 표현이 실제 액션 공간과 어긋나는 정렬 문제는 이 계열 전체의 공통 숙제로 남아 있다."]],
 see:["agibot-go1","dreamzero","vjepa2","comov"]},

{s:"uniact",t:"rfm",n:"UniAct",full:"Universal Actions for Enhanced Embodied Foundation Models",org:"—",d:"2025-03",aid:"CVPR 2025",venue:"CVPR 2025",src:"abs",
 lead:"코드북 기반의 범용 원자 액션을 학습한 뒤 로봇별 디코더로 풀어내는 방식.",
 body:[
  ["문제","로봇마다 자유도, 제어 인터페이스, 액션 스케일이 다르다. 이 이질성 때문에 여러 로봇 데이터를 섞어 학습해도 표현이 하나로 모이지 않고, 새 로봇에는 전이되지 않는다."],
  ["핵심 아이디어","물리적 액션 공간이 아니라 행동의 의미 수준에서 공통 어휘를 만든다. 이산 코드북으로 범용 원자 액션을 정의하고, 각 로봇에 대해서는 그 코드를 실제 명령으로 번역하는 경량 디코더만 학습한다. 새 로봇을 붙일 때 디코더만 학습하면 되므로 필요한 데이터가 크게 줄어든다."],
  ["저자들의 평가","적응 비용은 확실히 줄었지만 진정한 zero-shot 일반화에는 미달한다고 스스로 기술한다. [[open-challenges]]는 이 간극을 프롬프트로 새 로봇의 액션 공간을 가르치는 in-context learning으로 메울 수 있으리라 전망하지만, 그러려면 사전학습 패러다임 자체가 바뀌어야 한다고 덧붙인다."]],
 see:["cross-hand","open-challenges","open-problems"]},

{s:"comov",t:"rfm",n:"CoMo",full:"CoMo: Learning Continuous Latent Motion from Internet Videos",org:"—",d:"2025-05",aid:"arXiv:2505.17006",venue:"arXiv 프리프린트",src:"abs",
 lead:"인터넷 영상에서 연속 잠재 모션을 학습해 확장 가능한 로봇 학습에 활용한다.",
 body:[
  ["핵심 아이디어","[[lapa]] 계열이 잠재 액션을 이산 코드로 표현한 것과 달리, 연속 잠재 모션을 학습한다. 이산화가 미세한 동작 차이를 뭉개는 문제를 피하려는 선택이다."]],
 see:["lapa","being-h07"]},

{s:"vjepa2",t:"rfm",n:"V-JEPA 2",full:"V-JEPA 2: Self-Supervised Video Models Enable Understanding, Prediction and Planning",org:"Meta AI",d:"2025-06",aid:"arXiv:2506.09985",venue:"arXiv 프리프린트",key:1,
 lead:"픽셀 재구성 대신 잠재 임베딩 예측을 학습 목표로 삼는 월드 모델 계열.",
 body:[
  ["핵심 아이디어","미래를 픽셀 단위로 그리는 것은 낭비이자 방해다. 나뭇잎의 흔들림이나 조명의 미세한 변화까지 맞히려다 보면 모델 용량이 예측 불가능하고 무관한 디테일에 쓰인다. JEPA 계열은 대신 미래 프레임의 잠재 표현을 예측하게 해서, 예측 가능하고 과제와 관련된 구조만 남기도록 유도한다."],
  ["구성","대규모 영상으로 마스킹된 패치의 잠재 표현을 예측하도록 사전학습한 뒤, 소량의 액션 라벨 데이터로 계층적 예측기를 사후학습해 현재 관측과 액션으로부터 미래 잠재를 예측하게 만든다. 이 예측기를 계획에 쓰면 모델 예측 제어와 유사한 형태가 된다."],
  ["대비되는 노선","생성형 월드 모델([[dreamzero]])은 상태와 액션으로부터 다음 상태를 직접 생성하고, 임베딩 예측 계열은 잠재만 예측한다. 전자는 영상이라는 밀집 감독 신호를 온전히 쓸 수 있고 후자는 장기 예측이 훨씬 싸다. 어느 쪽이 로봇에 맞는지는 2026년 시점에도 결론이 나지 않았다."]],
 see:["dreamzero","lapa","open-challenges"]},

{s:"being-h05",t:"rfm",n:"Being-H0.5",full:"Being-H0.5: Scaling Human-centric Robot Learning for Cross-embodiment Generalization",org:"—",d:"2026-01",aid:"arXiv:2601.12993",venue:"arXiv 프리프린트",src:"abs",
 lead:"인간 중심 데이터를 확장해 cross-embodiment 일반화를 노리는 계열.",
 body:[
  ["핵심 아이디어","로봇 데이터가 아니라 인간의 손 동작을 학습의 중심에 둔다. 사람의 손은 여러 로봇 손의 공통 상위 개념 역할을 할 수 있으므로, 인간 데이터로 학습한 표현이 embodiment 간 다리가 된다는 발상이다."],
  ["계열","후속 [[being-h07]]이 같은 데이터 기반 위에 잠재 world-action 모델을 얹는다. [[egoscale]]과 문제의식을 공유하되 규모와 접근이 다르다."]],
 see:["being-h07","egoscale","cross-hand"]},

{s:"dreamzero",t:"rfm",n:"DreamZero",full:"World Action Models are Zero-shot Policies",org:"NVIDIA GEAR",d:"2026-02",aid:"arXiv:2602.15922",venue:"arXiv 프리프린트",key:1,
 lead:"영상 확산 백본 위에 구축된 14B 규모의 world action model. 미래 세계 상태와 액션을 동시에 예측한다.",
 body:[
  ["문제 진단","VLA는 의미 일반화에는 강하지만 미지 환경의 새로운 물리적 동작으로는 일반화하지 못한다. 원인은 학습 신호에 있다. 데모의 액션 라벨은 희소하고 반복적이어서, 세계가 어떻게 변하는지에 대한 시공간 사전지식을 거의 담지 못한다. 그래서 새 과제마다 그 과제의 액션 데이터를 다시 모아야 한다."],
  ["핵심 아이디어 — 영상을 밀집 감독 신호로","영상은 세계가 어떻게 변하는지에 대한 조밀한 기록이다. 미래 영상과 액션을 함께 예측하도록 학습하면, 모델은 액션 라벨이 희소한 구간에서도 영상 예측 손실로부터 물리 동역학을 배운다. 그 결과 반복적인 데모 없이도 이질적 로봇 데이터에서 다양한 스킬을 습득한다는 것이 이 논문의 주장이다. 저자들은 이 부류를 VLA와 구분해 world action model이라 부른다."],
  ["구성","Wan2.1-I2V-14B-480P 이미지-투-비디오 확산 백본과 umt5-xxl 토크나이저 위에 구축했다. 학습 데이터로 DROID를 LeRobot 포맷으로 변환한 세트를 공개했고, AgiBot 체크포인트도 별도로 두었다."],
  ["보고된 결과","미지 과제 평균 진행률 39.5%, 일반화 2배 이상 개선. 다른 로봇이나 사람의 영상만 10~20분 주었을 때 미지 과제 성능이 42% 이상 상대 개선. 30분 분량 55개 궤적의 play 데이터로 새 양팔 로봇 YAM에 적응하면서도 zero-shot 일반화를 유지했다. 마지막 결과가 특히 중요한데, 새 몸에 적응시키면서 기존 일반화를 잃지 않았다는 뜻이기 때문이다."],
  ["지연 최적화","영상 확산 모델을 제어 루프에 넣는 것이 이 계열의 최대 난점이다. 비동기 폐루프 실행, CFG 병렬화, DiT 캐싱, Torch Compile과 CUDA Graphs, NVFP4 사후 양자화, cuDNN 어텐션 백엔드를 합쳐 5.7초를 150ms로 38배 단축해 7Hz 폐루프 제어를 달성했다고 기술한다. 단 7Hz는 정밀 접촉 과제 기준으로는 여전히 낮다."],
  ["저자들의 유보","인간 영상이 액션 주석 없이 다양한 스킬을 습득하게 할 잠재적 스케일링 경로를 열지만, 전이 메커니즘 강화에 대한 추가 연구가 필요하다고 명시했다."]],
 see:["groot-n2","vjepa2","fastwam","humanscale","open-problems"]},

{s:"mem",t:"rfm",n:"MEM",full:"MEM: Multi-scale Embodied Memory for Vision Language Action Models",org:"Physical Intelligence",d:"2026-03",aid:"arXiv:2603.03596",venue:"arXiv 프리프린트",src:"abs",
 lead:"VLA에 다중 시간 스케일의 임베디드 메모리를 부여하는 연구.",
 body:[
  ["문제","VLA는 사실상 현재 관측만 보고 행동한다. 장시간 과제에서는 이미 무엇을 했는지, 어느 서랍을 열어봤는지 같은 이력이 필요한데 액션 청크 단위 정책에는 그런 상태가 없다."],
  ["핵심 아이디어","서로 다른 시간 스케일의 메모리를 함께 유지한다. 짧은 스케일은 직전 동작의 연속성을, 긴 스케일은 과제 전체의 진행 상태를 담당한다. [[pi07]]의 참고문헌에 포함되어 있다."]],
 see:["pi07","open-problems"]},

{s:"cross-hand",t:"rfm",n:"Cross-Hand Latent Representation",full:"Cross-Hand Latent Representation for Vision-Language-Action Models",org:"UC San Diego 외",d:"2026-03",aid:"arXiv:2603.10158",venue:"arXiv 프리프린트",src:"abs",
 lead:"손 형상이 다른 embodiment 사이에서 공유 가능한 잠재 표현을 학습한다.",
 body:[
  ["핵심 아이디어","cross-embodiment 문제를 팔 전체가 아니라 손 단위로 좁힌다. 자유도와 관절 배치가 다른 손들 사이에도 파지 형상과 접촉 의도라는 공통 추상이 있으므로, 그 수준의 잠재 표현을 공유하고 손별 디코더로 실제 관절 명령을 만든다."],
  ["위치","[[uniact]]가 로봇 전체의 액션 어휘를 통일하려 한 것과 같은 착상을 다지 손이라는 가장 어려운 부분에 적용한 사례다."]],
 see:["uniact","being-h05","open-problems"]},

{s:"being-h07",t:"rfm",n:"Being-H0.7",full:"Being-H0.7: A Latent World-Action Model from Egocentric Videos",org:"—",d:"2026-05",aid:"arXiv:2605.00078",venue:"arXiv 프리프린트",src:"abs",
 lead:"1인칭 영상에서 학습한 잠재 world-action 모델.",
 body:[
  ["핵심 아이디어","[[lapa]]의 잠재 액션과 [[dreamzero]]의 월드 모델을 결합한다. 1인칭 영상에서 잠재 액션을 추출하는 동시에 그 잠재로 미래를 예측하게 해, 액션 라벨 없이도 정책과 동역학을 함께 학습한다."]],
 see:["being-h05","dreamzero","lapa","egoscale"]},

{s:"wh0",t:"rfm",n:"Wh0",full:"Wh0: Generative World Models as Scalable Sources of Egocentric Human Hand Manipulation Data",org:"—",d:"2026-06",aid:"arXiv:2606.22136",venue:"arXiv 프리프린트",src:"abs",
 lead:"생성형 월드 모델을 1인칭 손 조작 데이터의 공급원으로 사용한다.",
 body:[
  ["핵심 아이디어","월드 모델을 정책의 일부가 아니라 데이터 공장으로 쓴다. 텍스트 프롬프트로 다양한 환경을 생성하고 그 안에서 손 조작 영상을 합성하면, 수집 비용 없이 학습 데이터를 늘릴 수 있다. 데이터 부족을 연산 문제로 바꾸는 접근이다."],
  ["남는 문제","생성된 영상에는 실제 액션 시퀀스가 없다. 잠재 액션 추출([[lapa]] 계열)이나 리타게팅([[ego2robot]])으로 이를 메워야 하며, 생성 품질이 물리적으로 타당한지에 대한 검증도 별도 과제다."]],
 see:["dreamzero","ego2robot","lapa"]},

{s:"fastwam",t:"rfm",n:"Fast-WAM",full:"Fast-WAM: Do World Action Models Need Test-time Future Imagination?",org:"—",d:"2026-06",aid:"2026 프리프린트",venue:"프리프린트",src:"abs",
 lead:"추론 시 영상 생성을 건너뛰는 표현 전용 world action model.",
 body:[
  ["문제 제기","제목이 곧 질문이다. WAM이 좋은 이유가 학습 과정에서 영상 예측으로부터 물리를 배웠기 때문이라면, 추론 시점에도 굳이 미래를 그려야 하는가."],
  ["핵심 아이디어","학습에서는 영상 예측 목적을 쓰되 추론에서는 표현만 뽑고 생성을 생략한다. 이 계열의 가장 큰 병목인 지연을 구조적으로 없애는 접근이다."],
  ["비용 맥락","NVIDIA의 기술 블로그에 따르면 [[dreamzero]]식 액션 튜닝이 약 9 ZFLOPs, 전체 영상 사전학습과 적응을 합치면 50 ZFLOPs를 넘길 수 있다. 이 규모가 WAM 계열의 실용화를 가로막는 실질적 이유다."]],
 see:["dreamzero","groot-n2","open-problems"]},

{s:"groot-n2",t:"rfm",n:"GR00T N2",full:"NVIDIA Isaac GR00T N2",org:"NVIDIA",d:"2026-06",aid:"릴리스 (논문 미공개)",venue:"GTC 키노트",key:1,
 lead:"[[dreamzero]] 연구에 기반한 차세대 로봇 파운데이션 모델. 새로운 world action model 아키텍처를 채택했다고 발표되었다.",
 body:[
  ["아키텍처 전환의 의미","N1 계열이 VLM 백본 + 확산 액션 헤드였던 데 비해, N2는 영상 예측을 정책의 본체에 넣는 world action model로 넘어갔다. 같은 회사가 자사 VLA 계열을 스스로 대체하는 형태라 이 전환의 근거가 무엇인지가 관심사다."],
  ["발표 내용","새 환경의 새 과제 성공률이 기존 주요 VLA 대비 2배 이상이며, generalist 로봇 정책 부문에서 MolmoSpaces와 [[roboarena]] 1위라고 주장한다. 연말 공개를 예고한 상태다."],
  ["평가 시 유의점","논문이 아니라 GTC 키노트와 보도자료 기반의 주장이며 독립 재현이 없다. 같은 계열의 상용 라이선스 모델 GR00T N1.7이 조기 접근으로 제공되고 있다."]],
 see:["dreamzero","groot-n1","roboarena","fastwam"]},

/* ───────── 궤적 최적화 ───────── */
{s:"curobo",t:"traj",n:"cuRobo",full:"cuRobo: Parallelized Collision-Free Minimum-Jerk Robot Motion Generation",org:"NVIDIA",d:"2023-10",aid:"arXiv:2310.17274",venue:"ICRA 2023",key:1,
 lead:"GPU 병렬화로 충돌 없는 최소 저크 궤적 최적화를 실시간에 푸는 라이브러리.",
 body:[
  ["핵심 아이디어","궤적 최적화의 근본 문제는 비볼록성이다. 초기해에 따라 서로 다른 국소 최소점에 빠지므로 좋은 초기해를 찾는 것이 관건인데, 이 논문의 답은 좋은 초기해를 찾지 말고 수백 개를 동시에 최적화하라는 것이다. GPU에서는 시드 하나를 최적화하든 수백 개를 하든 벽시계 시간이 거의 같기 때문에, 비볼록성을 알고리즘이 아니라 병렬성으로 다룰 수 있다."],
  ["최적화 구성","L-BFGS 스텝 방향 추정에 병렬 잡음 라인서치를 결합한다. 보통의 라인서치가 순차적으로 스텝 크기를 줄여가는 반면, 여기서는 여러 스텝 크기를 동시에 평가한다. 입자 기반 솔버를 함께 돌려 초기 탐색을 담당시킨다. 충돌은 부호거리장 기반의 연속 스윕 항으로 다뤄, 이산 시점뿐 아니라 궤적 전 구간에서 회피를 보장한다."],
  ["보고된 성능","어려운 모션 생성 문제를 평균 50ms 내에 해결해 기존 궤적 최적화 대비 60배 빠르다. 병렬 기하 플래너는 20ms로 RRT-Connect 구현 대비 28배 이상, 충돌 없는 IK 솔버는 초당 7000~9000 질의 이상을 처리한다. Jetson AGX Orin 같은 15~60W 저전력 기기에서도 수십 밀리초대 지연을 유지한다."],
  ["후속","[[curobov2]]가 B-스플라인 파라미터화와 GPU 네이티브 인식 파이프라인으로 전면 재작성되었고, [[cutamp]]가 이 위에서 TAMP를 병렬화한다."]],
 see:["curobov2","cutamp","mpd"]},

{s:"cad-traj",t:"traj",n:"Constraint-Aware Diffusion",full:"Constraint-Aware Diffusion Models for Trajectory Optimization",org:"Princeton 외",d:"2024-06",aid:"arXiv:2406.00990",venue:"DDDAS 2024",src:"abs",
 lead:"제약 위반을 학습 목적에 직접 반영한 궤적 확산 모델.",
 body:[
  ["핵심 아이디어","생성 모델로 궤적을 만들면 제약을 만족한다는 보장이 없다. 이 논문은 확산 과정 중간의 잡음 섞인 궤적에 대해서도 제약 위반량을 평가해 손실에 넣는 하이브리드 손실을 쓴다. 최종 샘플만이 아니라 경로 전체를 제약 쪽으로 유도하는 셈이다."],
  ["결과와 한계","테이블탑 조작과 2차량 reach-avoid 문제에서 제약 위반을 줄이면서 국소 최적해에 가까운 샘플을 생성했다. 저자들은 제약 함수의 수치 적분과 위반량 산출용 샘플링 때문에 학습 시간이 길다는 점을 한계로 명시한다."]],
 see:["mpd","mbd","fsdmp"]},

{s:"cutamp",t:"traj",n:"cuTAMP",full:"Differentiable GPU-Parallelized Task and Motion Planning",org:"MIT",d:"2024-11",aid:"arXiv:2411.11833",venue:"arXiv 프리프린트",key:1,
 lead:"로봇 매니퓰레이터를 위한 GPU 병렬 TAMP 알고리즘.",
 body:[
  ["문제","TAMP는 이산 과제 계획과 연속 모션 계획이 얽힌 문제다. 어떤 순서로 무엇을 집을지(이산)와 그때 팔이 어디에 있어야 하는지(연속)를 함께 풀어야 하는데, 이산 골격 하나를 정할 때마다 연속 파라미터를 다시 풀어야 해서 느리다."],
  ["핵심 아이디어","연속 파라미터를 하나의 해가 아니라 입자 집합으로 다룬다. 조합적 샘플링으로 계획 파라미터 입자들을 한꺼번에 만들고, 이들을 GPU에서 동시에 공동 최적화해 제약을 만족하면서 비용이 낮은 것을 고른다. [[curobo]]와 같은 철학이 TAMP 층위로 올라온 형태다."],
  ["결과","입자 수를 늘릴수록, 특히 단일 입자를 넘어서는 순간부터 계획 시간과 해의 품질이 함께 개선된다는 것을 보였다. 여러 embodiment에 배치해 인식에서 행동까지를 초 단위로 수행했다."]],
 see:["curobo","mpd","dpo-seq"]},

{s:"mbd",t:"traj",n:"Model-Based Diffusion",full:"Model-Based Diffusion for Trajectory Optimization",org:"CMU 외",d:"2024-12",aid:"NeurIPS 2024",venue:"NeurIPS 2024",src:"abs",
 lead:"확산 모델을 학습된 사전이 아니라 최적화 솔버 자체로 사용한다.",
 body:[
  ["핵심 아이디어","확산의 역과정은 에너지 함수에 대한 Langevin 동역학과 형태가 같다. 궤적 최적화의 비용함수를 그대로 에너지로 삼으면, 데이터로 학습하지 않고도 확산 절차만으로 저비용 궤적을 샘플링할 수 있다. 데이터가 필요 없다는 것이 다른 확산 플래너와 결정적으로 다른 지점이다."],
  ["의미","확산을 생성 모델이 아니라 전역 최적화 알고리즘으로 본 사례다. 비볼록 궤적 최적화에서 국소 최소점을 벗어나는 성질을 온도 스케줄로 얻는다."]],
 see:["mpd","cad-traj","fsdmp"]},

{s:"mpd",t:"traj",n:"MPD",full:"Motion Planning Diffusion: Learning and Adapting Robot Motion Planning with Diffusion Models",org:"TU Darmstadt · DFKI",d:"2024-12",aid:"arXiv:2412.19948",venue:"arXiv 프리프린트",key:1,
 lead:"확산 모델로 궤적 분포 사전을 학습하고, planning-as-inference 틀에서 비용 유도 사후 샘플링으로 학습된 사전과 과제별 목적을 결합한다.",
 body:[
  ["문제의식","최적화 기반 플래너의 성능은 초기해에 크게 좌우된다. 통상 샘플링 기반 플래너로 초기해를 얻지만 고차원 복잡 장면에서 느리고 결과가 비평활하다. 그런데 같은 로봇으로 비슷한 문제를 반복해 푸는 상황이라면, 이전 해들의 분포를 학습해 사전으로 쓰는 편이 자연스럽다."],
  ["핵심 아이디어","궤적을 하나의 점이 아니라 분포로 본다. 계획을 추론 문제로 정식화하면 학습된 사전과 과제별 비용을 사후분포로 결합할 수 있고, 확산의 역과정에 비용 그래디언트를 주입하는 방식으로 그 사후에서 샘플링한다. 사전이 다봉성을 담고 있으므로 서로 다른 통과 경로를 동시에 얻는다."],
  ["사전이 갖춰야 할 성질","저자들은 세 가지를 든다. 거의 충돌이 없을 것, 복잡한 궤적을 표현할 것, 다봉성을 인코딩할 것. 미분 가능 비용 함수로 새 제약을 사후에 붙일 수 있다는 점이 실용적 장점이다."],
  ["위치","미해결 문제 12번에서 학습과 최적화를 결합하는 세 방식 중 학습된 초기해 제공에 해당한다."]],
 see:["flowmp","fsdmp","curobo","mbd","open-problems"]},

{s:"flowmp",t:"traj",n:"FlowMP",full:"FlowMP: Learning Motion Fields for Robot Planning with Conditional Flow Matching",org:"—",d:"2025-03",aid:"arXiv:2503.06135",venue:"arXiv 프리프린트",src:"abs",
 lead:"조건부 flow matching으로 반복 디노이징 없이 소수 스텝에 궤적을 생성한다.",
 body:[
  ["핵심 아이디어","확산 플래너는 궤적 하나를 얻는 데 수십 번의 디노이징이 필요해 반응형 계획에 부적합하다. flow matching은 시간 의존 벡터장을 직접 학습해 소수 스텝으로 같은 분포에서 샘플링한다."],
  ["부수 기여","기존 확산 플래너가 1차 동역학에 치우쳐 평활한 가속도 프로파일을 놓친다는 점을 지적하고, 모션 필드를 고차 동역학까지 다루도록 정식화했다. 이 문제의식은 [[curobov2]]가 B-스플라인으로 접근한 것과 같다."]],
 see:["mpd","fsdmp","curobov2"]},

{s:"dpo-seq",t:"traj",n:"Differentiable Particle Optimization",full:"Differentiable Particle Optimization for Fast Sequential Manipulation",org:"—",d:"2025-10",aid:"arXiv:2510.07674",venue:"arXiv 프리프린트",src:"abs",
 lead:"순차 조작 계획을 JAX 컴파일 기반 병렬 입자 최적화로 푼다.",
 body:[
  ["핵심 아이디어","계획의 많은 부분이 본질적으로 병렬화 가능하다는 관찰에서 출발한다. 문제 전체를 미분 가능하게 쓰고 JAX로 단일 커널로 컴파일하면, 여러 후보를 동시에 최적화하면서 그래디언트도 함께 얻는다."],
  ["맥락","기하 모션 계획이 마이크로초 영역에 도달한 최근 흐름의 연장선이며, [[cutamp]]와 같은 입자 기반 병렬화 철학을 공유한다."]],
 see:["cutamp","curobo"]},

{s:"curobov2",t:"traj",n:"cuRoboV2",full:"cuRoboV2: Dynamics-Aware Motion Generation with Depth-Fused Distance Fields for High-DoF Robots",org:"NVIDIA",d:"2026-03",aid:"arXiv:2603.05493",venue:"arXiv 프리프린트",key:1,
 lead:"cuRobo의 전면 재작성. 빠른 플래너가 실행 불가능한 궤적을 내고, 반응형 제어기가 고품질 인식을 못 다루며, 기존 솔버가 고자유도에서 실패하는 세 갈래 파편화를 하나로 묶는 것을 목표로 한다.",
 body:[
  ["핵심 아이디어 — 궤적의 표현을 바꾼다","기존 방식은 시간축을 잘게 나눠 시점마다 관절 위치를 독립 변수로 둔다. 이 파라미터화에서는 평활성이 최적화 목적의 벌점으로만 존재하므로, 해가 나와도 가속도와 저크가 불연속인 경우가 흔하고 그런 궤적은 실제 로봇에서 실행 불가능하다. B-스플라인으로 궤적을 표현하면 평활성이 표현 자체에 내재하고, 토크 한계 같은 동역학 제약을 제어점 수준에서 강제할 수 있다. 저자들은 이것이 단순한 품질 개선이 아니라 최적화 지형을 더 잘 조건화하는 변화라고 주장한다."],
  ["인식 파이프라인","GPU 네이티브 TSDF/ESDF를 생성한다. 기존 방식이 희소하게 할당된 블록 내부에서만 거리를 제공한 것과 달리 작업공간 전체를 덮는 조밀 부호거리장을 최대 10배 빠르게 만든다. 계획과 인식이 같은 메모리 공간에 있으므로 전송 병목이 사라진다."],
  ["고자유도 확장","위상 인식 기구학, 미분 가능 역동역학, map-reduce 방식 자기충돌 검사를 도입해 단일 팔에서 휴머노이드까지 확장한다."],
  ["측정값","계획 시간 48ms로 cuRobo의 36ms보다 다소 늘었으나 실행 가능성이 보장된다. 75퍼센타일 에너지 소비는 106J로 cuRobo 116J, VAMP 131~160J보다 낮다. 페이로드 문제 2600개 중 2591개를 풀어 cuRobo+NewtonDyn의 2525개를 앞섰다."],
  ["배포","2026년 4월 Apache 2.0 라이선스로 공개되었다. API가 v1과 호환되지 않아 기존 코드는 v0.7.8에 고정해야 한다."]],
 see:["curobo","cutamp","flowmp","open-problems"]},

{s:"fsdmp",t:"traj",n:"FSD-MP",full:"Function-Space Diffusion for Motion Planning",org:"—",d:"2026-07",aid:"arXiv:2607.02977",venue:"arXiv 프리프린트",src:"abs",
 lead:"궤적을 고정 길이 웨이포인트 열이 아니라 연속 함수로 보고 함수 공간에서 확산한다.",
 body:[
  ["문제","확산 플래너는 고정 길이 웨이포인트 시퀀스 위에서 정의되므로 학습한 해상도에 묶인다. 더 촘촘한 궤적이 필요하면 모델을 다시 학습해야 하고, 해상도를 바꾼 zero-shot 일반화가 되지 않는다."],
  ["핵심 아이디어","궤적을 시간의 연속 함수로 두고 함수 공간에서 확산 과정을 정의한다. 스펙트럼 영역에서 Matérn형 공분산을 갖는 가우시안 잡음으로 모드별 forward process를 세우고, 역과정을 경계 호환 이산 사인 변환 기반 Fourier Neural Operator로 파라미터화한다. DST를 쓰는 이유는 시작점과 목표점 제약이 해상도와 무관하게 보존되기 때문이다."],
  ["의의","이산화 불변성을 확보하면 하나의 모델로 계획 해상도를 자유롭게 바꿀 수 있다. 궤적을 함수로 보는 관점은 [[curobov2]]의 B-스플라인 파라미터화와 문제의식이 겹친다."]],
 see:["mpd","flowmp","curobov2"]},
/* ───────── MPC ───────── */
{s:"cimpc-quad",t:"mpc",n:"CI-MPC (사족)",full:"Contact-Implicit MPC: Controlling Diverse Quadruped Motions Without Pre-Planned Contact Modes or Trajectories",org:"KAIST",d:"2023-12",aid:"arXiv:2312.08961",venue:"IJRR",
 lead:"사전에 계획된 접촉 모드나 궤적 없이 다양한 사족 동작을 제어한다.",
 body:[
  ["핵심 아이디어","보행 제어의 통상적 접근은 접촉 스케줄을 사람이 미리 정하는 것이다. 어느 발이 언제 땅에 닿을지를 고정하면 문제가 매끄러워져 풀기 쉬워지지만, 정해둔 보행 패턴 밖으로는 나갈 수 없다. 접촉 암시적 정식화는 접촉 여부 자체를 최적화 변수로 남겨두어 제어기가 상황에 맞는 접촉 순서를 스스로 만들어내게 한다."],
  ["기여","이 정식화가 실시간 제어 주기 안에서 동작할 수 있음을 보였다. 24자유도급 시스템에서 50Hz 수준의 계산 성능이 이 계열에서 보고된 기준선이다."]],
 see:["fast-cimpc","cimpc-global"]},

{s:"fast-cimpc",t:"mpc",n:"Fast Contact-Implicit MPC",full:"Fast Contact-Implicit Model Predictive Control",org:"Stanford · CMU",d:"2024-04",aid:"IEEE T-RO 40:1617–1629",venue:"IEEE T-RO 2024",key:1,
 lead:"접촉 암시적 MPC의 실시간 계산 기반을 닦은 연구. 이후 다수의 CI-MPC 논문이 성능 비교 기준으로 삼는다.",
 body:[
  ["문제","접촉이 포함된 궤적 최적화는 상보성 제약 때문에 비평활하고 조건수가 나쁘다. 표준 솔버는 이런 문제에서 수렴이 느리거나 실패하고, 제어 주기 안에 해를 못 내면 MPC가 성립하지 않는다."],
  ["핵심 아이디어","상보성 제약을 완화된 형태로 다루면서 그 완화 정도를 최적화 과정에서 점진적으로 조이고, 접촉이 만드는 비평활 지점에서도 안정적인 그래디언트를 얻는 맞춤 솔버를 설계한다. 문제 구조를 이용해 선형계를 효율적으로 푸는 것이 속도의 핵심이다."],
  ["계열의 보고 성능","24자유도 휴머노이드 50Hz, 양팔 100Hz([[fast-cimpc]]와 함께 인용되는 Kurtz 등의 역동역학 궤적 최적화, IJRR 45(1)), 평면 밀기 루프당 1초 이하([[push-anything]]) 수준이 문헌에 보고되어 있다. 해석적 1차원 사영, 병렬 MIQP 해석, 합의 정식화, 신뢰영역·도그레그 솔버가 각각 기여했다."]],
 see:["cimpc-global","cimpc-quad","push-anything"]},

{s:"sampling-mpc-phys",t:"mpc",n:"Sampling-based MPC with parallel physics",full:"Sampling-based Model Predictive Control Leveraging Parallelizable Physics Simulations",org:"TU Delft",d:"2025-01",aid:"2025 프리프린트",venue:"프리프린트",src:"abs",
 lead:"GPU 병렬 시뮬레이터를 동역학 모델로 삼는 MPPI 계열.",
 body:[
  ["핵심 아이디어","동역학 모델을 수식으로 쓰지 않고 시뮬레이터가 암묵적으로 정의하게 한다. IsaacGym 같은 GPU 병렬 시뮬레이터에서 수천 개의 롤아웃을 동시에 굴리면, 접촉이 아무리 복잡해도 모델링 없이 MPPI를 돌릴 수 있다. 새 물체나 새 로봇으로 확장할 때 모델을 다시 유도할 필요가 없다는 것이 최대 장점이다."],
  ["적용","이동 중 충돌 회피, 비파지 조작, 고차원 전신 제어까지 같은 틀로 다뤘다."],
  ["한계","시뮬레이터의 접촉 파라미터가 실제와 다르면 그 오차가 그대로 제어 성능에 반영된다. [[parallel-smpc-real]]이 이 문제를 실기에서 정량화한다."]],
 see:["parallel-smpc-real","feedback-mppi"]},

{s:"cimpc-global",t:"mpc",n:"전역 근사 CI-MPC",full:"Approximating Global Contact-Implicit MPC via Sampling and Local Complementarity",org:"UPenn",d:"2025-05",aid:"arXiv:2505.13350",venue:"IEEE RA-L 10(11):12117–12124",key:1,
 lead:"국소 상보성 기반 제어와 저차원 전역 샘플링을 결합해, 접촉 암시적 제어가 갇히던 국소 최소점을 벗어나려는 연구.",
 body:[
  ["문제","범용 정밀 조작을 하려면 접촉 풍부 행동을 실시간에 고안하고 실행해야 한다. 그런데 가능한 접촉 시퀀스의 수가 지수적이라 기존 모델 기반 제어기는 실시간 전역 최적화를 할 수 없다. 그래서 진전은 단순화된, 그러나 여전히 하이브리드인 모델로 국소 근사를 취하는 방향으로 이뤄져 왔고, 그 결과 제어기가 가까운 접촉만 활용할 수 있어 접촉 공간을 넓게 탐색하려면 외부 개입이 필요했다."],
  ["핵심 아이디어 — 탐색과 최적화의 분업","전역 탐색을 저차원 공간으로 내린다. 매 제어 루프마다 접촉 없는 단계가 접촉 풍부 단계에 선행한다고 보고, 접촉 없는 단계에서 도달 가능한 엔드이펙터 위치들을 병렬로 샘플링한다. 엔드이펙터 위치는 접촉 시퀀스 공간보다 훨씬 저차원이므로 전역 샘플링이 가능하다. 그 다음 각 샘플 위치 근방에서 국소 접촉 MPC를 돌려 예측 비용을 계산하고 가장 좋은 것을 고른다. 전역성은 샘플링이, 정확도는 상보성 기반 국소 최적화가 담당한다."],
  ["효과","다물체 조작처럼 비볼록한 과제에서 국소 최소점을 벗어나는 경로를 제공한다. 어느 물체를 먼저 밀어 치울지 같은 전역 결정과 그 물체를 어떻게 밀지 같은 국소 결정을 같은 루프에서 처리하는 셈이다."],
  ["위치","미해결 문제 6번 항목의 문제 설정을 이 논문 서두가 가장 명료하게 진술한다."]],
 see:["fast-cimpc","push-anything","cascaded-contact","where-to-touch","open-problems"]},

{s:"push-anything",t:"mpc",n:"Push Anything",full:"Push Anything: Single- and Multi-Object Pushing From First Sight with Contact-Implicit MPC",org:"UPenn (DAIR Lab)",d:"2025-10",aid:"arXiv:2510.19974",venue:"ICRA 2026",
 lead:"첫 관측만으로 다양한 형상의 물체를 단일·다물체로 미는 CI-MPC 시스템.",
 body:[
  ["문제","비파지 조작은 물체의 물리적 성질을 모르고 접촉 상호작용이 복잡해 어렵다. CI-MPC가 유망하다는 것은 알려져 있었지만, 시연이 좁게 선별된 예시에 머물러 일반성이 입증되지 않았다."],
  ["핵심 아이디어","C3+(Consensus Complementarity Control Plus)로 기존 합의 상보성 제어를 강화하고, 물체 스캔에서 제어까지를 잇는 완전한 파이프라인에 통합했다. 다물체 장면에서는 물체 간 접촉과 물체-환경 접촉을 함께 추론해야 하는데, 이는 이전 CI-MPC 방법으로는 다루기 어려웠던 규모다."],
  ["의의","처음 보는 물체를 스캔하고 곧바로 정밀하게 미는 것, 그리고 어질러진 환경을 전략적으로 정리하는 것을 같은 제어기로 수행했다. CI-MPC가 선별된 데모를 넘어 실용 범위로 확장될 수 있음을 보인 사례다."]],
 see:["cimpc-global","fast-cimpc"]},

{s:"spider",t:"mpc",n:"SPIDER",full:"SPIDER: Scalable Physics-Informed Dexterous Retargeting",org:"Meta · UC Berkeley 외",d:"2025-11",aid:"arXiv:2511.09484",venue:"arXiv 프리프린트",src:"abs",
 lead:"인간 손 동작을 로봇 손으로 옮기는 과정에 물리 제약을 반영한 확장 가능한 리타게팅.",
 body:[
  ["문제","인간 영상에서 손 자세를 추출해 로봇 손 관절로 매핑하는 순수 기하 리타게팅은 물리적으로 불가능한 결과를 낸다. 물체를 관통하거나 접촉력이 성립하지 않는 자세가 흔하다. 인간 데이터를 대규모로 쓰려면 이 단계가 병목이다."],
  ["핵심 아이디어","리타게팅에 물리를 넣는다. 접촉과 동역학 타당성을 만족하도록 궤적을 보정하면 결과가 실제 로봇에서 실행 가능해진다."],
  ["위치","[[egoscale]], [[ego2robot]] 같은 인간 데이터 활용 계열이 전제하는 전처리 단계를 제어 이론 쪽에서 다룬 연구다."]],
 see:["egoscale","ego2robot","open-problems"]},

{s:"where-to-touch",t:"mpc",n:"Where to Touch, How to Contact",full:"Where to Touch, How to Contact: A Hierarchical RL–MPC Framework for Geometry-Aware Manipulation",org:"Arizona State · UT Dallas · UPenn",d:"2026-01",aid:"arXiv:2601.10930",venue:"arXiv 프리프린트",key:1,
 lead:"정밀 조작이 본질적으로 계층적이라는 관찰에 기반해, 상위 강화학습과 하위 접촉 암시적 MPC를 접촉 의도라는 인터페이스로 연결한 프레임워크.",
 body:[
  ["문제","접촉 풍부 정밀 조작은 전역 기하와 비평활 접촉 동역학을 함께 추론해야 한다. 끝단 대 끝단 정책은 이 구조를 우회하지만 데이터가 많이 들고 시뮬레이션에서 현실로 잘 넘어오지 못하며 과제와 embodiment를 넘나드는 일반화가 약하다."],
  ["핵심 아이디어 — 접촉 의도(contact intention)","저자들의 관찰은 단순하다. 상위에서는 어디를 만질지를 기하학적으로 정하고, 하위에서는 접촉 동역학을 통해 물체를 어떻게 움직일지를 정한다. 이 둘을 잇는 인터페이스로 물체 중심의 접촉 의도를 정의하는데, 여기에는 두 가지가 들어간다. 물체 표면의 접촉 위치와 접촉 이후 물체가 도달해야 할 서브골 자세다. 상위 RL 정책이 이 접촉 의도를 예측하고, 하위 CI-MPC가 그것을 조건으로 국소 접촉 모드를 최적화하며 실시간 재계획한다."],
  ["학습 효율 장치","상위 정책을 학습할 때 로봇 팔 전체를 시뮬레이션하지 않고 질량-스프링-댐퍼 점으로 추상화한 엔드이펙터를 쓴다. 하위 MPC 복잡도가 빠지므로 학습이 빨라진다."],
  ["기존 RL-MPC 결합과의 차이","저자들은 선행 연구에서 RL이 보조 안내나 궤적 예측 역할에 그쳤던 반면, 여기서는 접촉 의도라는 인터페이스를 통해 두 층이 긴밀히 결합된다고 정리한다. RL이 물체 기하와 기구학을 추론하고 MPC가 고주파 접촉 전략을 담당하는 역할 분담이다."],
  ["위치","미해결 문제 12번에서 학습과 최적화를 결합하는 세 방식 중 계층 분해에 해당하는 대표 사례다."]],
 see:["cimpc-global","probeact","mpd","open-problems"]},

{s:"zeroshot-dex",t:"mpc",n:"Zero-Shot Sim-to-Real 다지 파지",full:"Closing the Reality Gap: Zero-Shot Sim-to-Real Deployment for Dexterous Force-Based Grasping and Manipulation",org:"UCL 외",d:"2026-01",aid:"arXiv:2601.02778",venue:"arXiv 프리프린트",
 lead:"조밀 촉각 피드백과 관절 토크 감지로 물리적 상호작용을 명시적으로 조절하는 sim-to-real 강화학습 프레임워크.",
 body:[
  ["문제","로코모션에서는 sim-to-real RL이 산업 배치까지 갔지만 다지 손에서는 그렇지 못했다. 원인은 접촉 물리와 구동기 동역학의 모델 오차다. 다지 손은 접촉점이 많고 케이블·기어 구동의 비선형성이 커서 시뮬레이션과 실제가 크게 어긋난다."],
  ["핵심 아이디어","관측 공간에 촉각과 토크를 함께 넣어 정책이 상호작용력을 명시적으로 조절하게 만들고, 시뮬레이션 쪽에서는 확장 가능한 촉각 시뮬레이션, 전류-토크 캘리브레이션, 구동기 동역학의 불확실성 모델링을 결합해 격차를 줄인다. 로코모션 커뮤니티의 sim-to-real 레시피를 손에 이식한 형태다."],
  ["결과","비대칭 actor-critic PPO로 시뮬레이션만 학습해 5지 손에 zero-shot 전개했다. 지령 기반 파지력 추종과 손 안 물체 재배향 두 가지를 로봇 상 미세조정 없이 수행했으며, 다지 손에서 제어 가능한 파지를 시뮬레이션만으로 학습해 zero-shot 전개한 최초 사례라고 주장한다."]],
 see:["ftp1","spider","open-problems"]},

{s:"feedback-mppi",t:"mpc",n:"Feedback-MPPI",full:"Feedback-MPPI: Fast Sampling-Based MPC via Rollout Differentiation",org:"UCL · IIT",d:"2026-01",aid:"IEEE RA-L 11(1):1–8",venue:"IEEE RA-L 2026",src:"abs",
 lead:"롤아웃 미분을 통해 저수준 제어기 없이 빠른 샘플링 기반 MPC를 구성한다.",
 body:[
  ["문제","MPPI는 계산이 무거워 낮은 주파수로만 돌릴 수 있고, 그 사이를 메우기 위해 별도의 저수준 추종 제어기를 두는 것이 관행이다. 그런데 이 이중 구조는 튜닝 부담을 늘리고 저수준 제어기가 MPC의 의도를 왜곡한다."],
  ["핵심 아이디어","롤아웃을 미분해 최적해 주변의 국소 피드백 게인을 함께 얻는다. MPC가 개루프 명령열이 아니라 피드백 법칙을 내놓으므로, 낮은 주파수로 재계획하면서도 그 사이 고주파 보정을 자체적으로 수행한다. 부제의 표현대로 저수준 제어기와 작별하는 것이 목표다."]],
 see:["sampling-mpc-phys","parallel-smpc-real"]},

{s:"cascaded-contact",t:"mpc",n:"Cascaded Contact Selection",full:"Simultaneous Contact Selection and Planning for Contact-Rich Manipulation with Cascaded Optimization",org:"—",d:"2026-05",aid:"arXiv:2605.27972",venue:"arXiv 프리프린트",src:"abs",
 lead:"접촉점 선택과 궤적 계획을 계단식 최적화로 함께 푼다.",
 body:[
  ["문제","접촉 암시적 궤적 최적화는 허용 접촉점의 수가 늘어나면 해 시간이 가파르게 증가한다. 그래서 실제로는 소수의 단순 기하만 접촉 가능하다고 미리 제한하는데, 이것이 적용 범위를 좁힌다."],
  ["핵심 아이디어","어느 점이 실제로 중요한지를 최적화 과정 안에서 판별한다. STOCS 계열이 제안한 착상으로, 유효한 접촉점과 시점을 반복적으로 식별해 매 하위 문제의 변수와 제약 수를 줄인다. 이 논문은 그 선택과 계획을 계단식 구조로 결합했다."]],
 see:["cimpc-global","fast-cimpc"]},

{s:"parallel-smpc-real",t:"mpc",n:"대규모 병렬 샘플링 MPC 실기 배치",full:"Real-World Deployment of Massively Parallel Sampling-Based MPC for Contact-Rich Manipulation",org:"TU Darmstadt · DFKI",d:"2026-06",aid:"arXiv:2606.20712",venue:"arXiv 프리프린트",key:1,
 lead:"샘플링 기반 MPC를 실제 로봇에 배치하고 무엇이 왜 안 되는지를 구체적으로 분석한 연구.",
 body:[
  ["동기","샘플링 기반 MPC는 그래디언트 없는 최적화와 대규모 병렬 GPU 시뮬레이션을 결합한다는 점에서 접촉 조작에 유망하지만, 기존 연구 대부분이 단순화된 동역학에 의존하거나 시뮬레이션에 머물렀다. 실기에서 무엇이 병목인지가 정리되지 않았다는 것이 이 논문의 출발점이다."],
  ["구성","JAX 대규모 병렬화와 고충실도 MuJoCo MJX 시뮬레이터를 결합한 MPC를 Franka Research 3에 real-to-sim-to-real 파이프라인으로 배치하고 Push-T 과제를 수행했다."],
  ["결과 1 — 다봉 탐색의 필요","구조적 전역 샘플링을 쓰는 Model Tensor Planning 변형이 모드 전환이 필요한 과제에서 CEM, MPPI, PS 같은 단봉 기준선을 시뮬레이션과 실기 양쪽에서 앞섰다. 밀기 방향을 바꿔야 하는 순간처럼 해가 불연속적으로 갈리는 지점에서 단봉 분포는 구조적으로 불리하다."],
  ["결과 2 — 온라인 도메인 랜덤화의 한계","MPC 샘플 예산 안에서 도메인 랜덤화를 평가한 결과, 접촉 개시 파라미터는 해석 가능한 적응 신호를 주지만 전역 물리 파라미터는 통상적 재계획 주파수에서 신뢰성 있게 활용하기엔 피드백이 너무 약했다. 실시간에 물리 파라미터를 추정해 쓰겠다는 구상이 왜 잘 안 되는지에 대한 구체적 진단이다."],
  ["저자들이 정리한 난점","접촉 민감성, 빠듯한 연산 예산, 실시간에서 유의미한 도메인 랜덤화 신호를 얻기 어려움. 세 가지 모두 이 위키의 미해결 문제 6번 항목에서 근거로 쓰인다."]],
 see:["sampling-mpc-phys","feedback-mppi","open-problems"]},

/* ───────── 데이터 · 평가 ───────── */
{s:"libero",t:"data",n:"LIBERO",full:"LIBERO: Benchmarking Knowledge Transfer for Lifelong Robot Learning",org:"UT Austin",d:"2023-06",aid:"arXiv:2306.03310",venue:"NeurIPS 2023",
 lead:"평생학습에서의 지식 전이를 평가하는 시뮬레이션 벤치마크.",
 body:[
  ["설계","전이해야 할 지식의 종류를 축으로 분리한다. 공간 관계만 바뀌는 과제군, 물체만 바뀌는 과제군, 목표만 바뀌는 과제군, 그리고 장기 과제군을 따로 두어 어떤 종류의 지식이 전이되고 어떤 것이 안 되는지를 분해할 수 있게 했다."],
  ["현재 위치","VLA 논문의 사실상 표준 비교축이 되었으나, 시뮬레이션 성능과 실기 성능의 상관이 낮다는 지적이 반복된다. [[vla-arena]]는 LIBERO 계열 점수에서의 우위가 조합 과제나 섭동 조건으로 넘어가면 뒤집힐 수 있다는 것을 순위 역전으로 보였다."]],
 see:["simplerenv","vla-arena","probeact"]},

{s:"oxe",t:"data",n:"Open X-Embodiment",full:"Open X-Embodiment: Robotic Learning Datasets and RT-X Models",org:"다기관 협업",d:"2023-10",aid:"arXiv:2310.08864",venue:"ICRA 2024",key:1,
 lead:"약 70개의 소규모 데이터셋을 통합해 100만 개 이상의 에피소드를 모은 데이터셋.",
 body:[
  ["핵심 기여","분산된 로봇 데이터를 하나의 표준 포맷으로 모을 수 있고, 그렇게 모으면 실제로 이득이 있다는 것을 보였다. 여러 로봇의 데이터를 섞어 학습한 RT-X 모델이 각 로봇의 데이터만으로 학습한 모델보다 나은 성능을 보인 결과가 cross-embodiment 사전학습의 근거가 되었다."],
  ["한계","이 규모로 학습해도 VLA는 분포 밖 환경과 로봇 설정에 취약해 추가 에피소드 수집이 필요하다는 것이 [[open-challenges]]의 진단이다. 수집 주체의 인지적 편차, 카메라 위치·각도 차이, embodiment 차이에서 오는 분산과 잡음도 문제로 지적된다. 데이터의 양이 아니라 분포의 성격이 병목이라는 인식이 이후 [[agibot-go1]]과 1인칭 영상 계열로 이어진다."]],
 see:["droid","agibot-go1","open-challenges","humanscale"]},

{s:"droid",t:"data",n:"DROID",full:"DROID: A Large-Scale In-the-Wild Robot Manipulation Dataset",org:"다기관 협업",d:"2024-03",aid:"arXiv:2403.12945",venue:"RSS 2024",key:1,
 lead:"표준화된 하드웨어 구성을 여러 기관에 배포해 실환경에서 수집한 대규모 조작 데이터셋.",
 body:[
  ["핵심 아이디어","다양성을 로봇이 아니라 환경에서 얻는다. 동일한 Franka 기반 구성을 여러 연구실과 실제 생활공간에 배포하고 같은 방식으로 수집하면, 로봇 쪽 변수는 통제되면서 장면·물체·조명의 다양성만 커진다. 이 설계 덕분에 데이터가 정책 평가의 공통 기반으로도 쓸 수 있게 되었다."],
  ["파급","[[roboarena]]가 이 플랫폼을 평가 기반으로 삼는 이유가 바로 그 표준화다. [[dreamzero]]도 DROID를 학습 데이터로 변환해 공개했다."]],
 see:["roboarena","oxe","dreamzero"]},

{s:"simplerenv",t:"data",n:"SimplerEnv",full:"Evaluating Real-World Robot Manipulation Policies in Simulation",org:"UC San Diego 외",d:"2024-05",aid:"arXiv:2405.05941",venue:"CoRL 2024",
 lead:"실기 정책을 시뮬레이션에서 평가할 때 생기는 격차를 줄이려는 환경.",
 body:[
  ["핵심 아이디어","시각 격차와 제어 격차를 나눠 각각 다르게 다룬다. 시각 쪽은 실제 장면 이미지에 인페인팅을 적용해 시뮬레이션 렌더링과의 외형 차이를 줄이고, 제어 쪽은 시뮬레이션 로봇의 동역학 파라미터를 실제 궤적에 맞춰 조정해 같은 명령이 비슷한 움직임을 내도록 정렬한다."],
  ["남은 문제","[[open-challenges]]는 반사, 렌즈 플레어, 물·먼지·잔해로 인한 카메라 잡음 같은 넓은 범위의 아티팩트가 여전히 반영되지 않으며, 관절 PD 파라미터나 표면 질감의 미세한 차이도 남는다고 지적한다."]],
 see:["libero","vla-arena","robotarena-inf"]},

{s:"egodex",t:"data",n:"EgoDex",full:"EgoDex: Learning Dexterous Manipulation from Large-Scale Egocentric Video",org:"Apple",d:"2025-05",aid:"arXiv:2505.11709",venue:"ICLR 2026",key:1,
 lead:"Apple Vision Pro로 수집한 829시간 분량의 1인칭 영상과 손 자세 주석 데이터셋. 인간 영상 계열의 데이터 기반을 만들었다.",
 body:[
  ["문제","모방학습의 데이터 부족은 잘 알려진 문제지만, 기존 대규모 1인칭 데이터셋(Ego4D 등)은 손 자세 주석이 없고 물체 조작에 초점을 두지도 않았다. 인터넷 영상은 양은 많아도 정밀 조작 학습에 필요한 주석이 없다."],
  ["핵심 아이디어","계측 장비로 중간 지대를 만든다. Vision Pro의 다중 캘리브레이션 카메라와 온디바이스 SLAM을 쓰면 촬영 시점에 손의 모든 관절 자세를 정확히 추적할 수 있다. 수동적으로 확장 가능하면서도 정밀 주석이 붙은 데이터가 된다."],
  ["규모","829시간, 1080p 30Hz, 9천만 프레임, 33만 8천 건의 과제 시연, 194개 테이블탑 과제. 신발끈 묶기부터 세탁물 접기까지 일상 물체를 다루는 행동을 담았다. 손 궤적 예측 정책의 학습·평가 프로토콜과 지표도 함께 제시했다."],
  ["파급","[[egoscale]], [[humanscale]], [[egolive]]로 이어지는 1인칭 데이터 계열의 출발점이며, [[spider]] 같은 리타게팅 연구의 입력이기도 하다."]],
 see:["egoscale","humanscale","egolive","spider"]},

{s:"agibot-go1",t:"data",n:"AgiBot World / GO-1",full:"AgiBot World Colosseo: A Large-scale Manipulation Platform for Scalable and Intelligent Embodied Systems",org:"AgiBot · OpenDriveLab",d:"2025-03",aid:"arXiv:2503.06669",venue:"IROS 2025",key:1,
 lead:"100대의 양팔 휴머노이드로 217개 과제, 100만 개 이상의 궤적을 수집한 플랫폼과 generalist 정책 GO-1.",
 body:[
  ["데이터 설계","동일 기종 로봇 100대를 5개 배치 시나리오에 투입하고, 표준화된 수집 파이프라인과 human-in-the-loop 검증으로 품질을 관리했다. 그리퍼뿐 아니라 6자유도 다지 손과 시각-촉각 센서까지 확장 가능하게 설계해, 정밀 스킬 데이터를 나중에 붙일 수 있는 여지를 남겼다."],
  ["GO-1의 핵심 아이디어","잠재 액션을 중간 표현으로 둔다. 시각-언어 모듈이 관측과 지시를 인코딩하면 잠재 플래너가 k개의 잠재 액션 토큰을 예측하고, action expert가 그 토큰을 조건으로 디노이징해 최종 제어 신호를 만든다. 잠재 층을 둔 이유는 액션 라벨이 없는 데이터까지 학습에 끌어쓰기 위해서이며, [[lapa]] 계열과 착상을 공유한다."],
  ["보고된 결과","이 데이터셋으로 사전학습한 정책이 [[oxe]] 사전학습 대비 in-domain 0.47에서 0.77, 분포 밖 0.38에서 0.67로 완료 점수가 올랐다. 복잡한 과제에서 60% 이상 성공률로 [[rdt1b]] 대비 32% 개선을 보고했으며, 데이터 양이 늘수록 성능이 예측 가능하게 오르는 스케일링 거동을 확인했다."],
  ["의미","같은 모델 구조라도 사전학습 데이터를 바꾸면 큰 차이가 난다는 것을 통제 비교로 보였다. 데이터의 질과 분포가 병목이라는 인식을 강화한 결과다."]],
 see:["oxe","lapa","rdt1b","humanscale"]},

{s:"roboarena",t:"data",n:"RoboArena",full:"RoboArena: Distributed Real-World Evaluation of Generalist Robot Policies",org:"UC Berkeley · Stanford 외",d:"2025-06",aid:"arXiv:2506.18123",venue:"ICLR 2026",key:1,
 lead:"고정된 과제·환경·장소를 표준화하는 대신, 분산된 평가자 네트워크에 평가를 크라우드소싱하는 접근.",
 body:[
  ["문제의식","전통적 로봇 벤치마킹은 공정성을 위해 조명, 물체, 위치를 엄격히 표준화한다. 그런데 그 경직성이 바로 일반화 측정을 막는다. 단일 표준 실험실에서만 시험하면 현실의 지저분함을 다루는 능력은 측정되지 않는다. 반대로 중앙집중식 로봇 챌린지는 generalist 정책을 넓은 과제 범위에서 평가하는 데 확장되지 않는다."],
  ["핵심 아이디어","다양성과 싸우지 말고 받아들인다. 여러 기관의 평가자가 각자 원하는 과제와 환경을 골라 두 정책을 이중맹검으로 비교하고, 그 쌍대 선호를 랭킹 체계로 종합한다. 언어 모델의 챗봇 아레나와 같은 구조를 물리 평가에 옮긴 것이다. [[droid]] 플랫폼을 기반으로 하므로 하드웨어 변수는 통제된다."],
  ["평가 대상","DROID로 파인튜닝된 공개 generalist 정책들을 대상으로 했다. π0 계열 flow 정책, π0-FAST, 그리고 서로 다른 액션 표현으로 파인튜닝한 PaliGemma 변형들이 포함된다."],
  ["지적된 한계","[[robotarena-inf]]는 RoboArena가 DROID 환경, 다섯 개 과제, 세 개 정적 실환경 장면 수준에 머문다는 점을 지적하며 더 확장 가능한 평가 틀을 제안한다."]],
 see:["robotarena-inf","vla-arena","droid","groot-n2"]},

{s:"vla-arena",t:"data",n:"VLA-Arena",full:"VLA-Arena: An Open-Source Framework for Benchmarking Vision-Language-Action Models",org:"—",d:"2025-12",aid:"arXiv:2512.22539",venue:"arXiv 프리프린트",key:1,
 lead:"난이도 축과 섭동 진단 축을 분리해 일반화를 성분별로 측정하는 벤치마크.",
 body:[
  ["핵심 아이디어 — 축의 분리","단일 성공률로는 무엇이 되고 안 되는지를 알 수 없다. 이 벤치마크는 두 종류의 축을 직교시킨다. 하나는 난이도 축 L0~L2로 과제의 조합성을 계단식으로 올리고, 다른 하나는 언어 섭동 W0~W4와 시각 섭동 V0~V4로 어느 과제에나 적용 가능한 진단 프로브다. 후자는 모델이 견고한 그라운딩을 가졌는지 표면적 패턴 매칭을 하는지를 구분하기 위한 장치다."],
  ["실측 결론","자기회귀 계열과 확산 계열을 아우른 SOTA VLA 전반에서 네 가지 공통 한계가 확인되었다. 일반화보다 암기, 표면적 시각 인식, 안전 제약 무시, 장기 스킬 조합 실패. 모든 모델이 L0에 강하게 과적합되어 L1·L2 조합 과제와 섭동 조건에서 성공률이 급락했다."],
  ["순위 역전","L0~L2 사이에서 모델 순위가 뒤집히는 현상이 관찰되었다. 각 레벨이 중복되지 않는 정보를 준다는 뜻이며, 동시에 단일 벤치마크 점수로 정책의 일반성을 주장하기 어렵다는 근거이기도 하다."],
  ["부수 기여","안전을 성공률과 별도의 누적 비용 지표로 측정해, 안전-성능 교환비를 벤치마크 수준에서 드러냈다."]],
 see:["roboarena","robotarena-inf","safevla","open-problems"]},

{s:"egoscale",t:"data",n:"EgoScale",full:"EgoScale: Scaling Dexterous Manipulation with Diverse Egocentric Human Data",org:"—",d:"2026-02",aid:"arXiv:2602.16710",venue:"arXiv 프리프린트",key:1,
 lead:"20,854시간 분량의 액션 라벨링된 1인칭 인간 영상으로 flow 기반 VLA를 사전학습하고, 인간 데이터 규모와 검증 손실 사이의 로그-선형 스케일링 법칙을 보고했다.",
 body:[
  ["문제","인간 행동은 물리적 지능 학습에 가장 확장 가능한 데이터원이지만, 이를 정밀 조작에 어떻게 쓸지는 불분명했다. 제한된 환경에서의 인간-로봇 전이는 선행 연구가 보였으나, 대규모 인간 데이터가 고자유도 정밀 조작까지 지탱할 수 있는지는 검증되지 않았다."],
  ["핵심 아이디어 — 전이를 스케일링 현상으로 본다","저자들의 주장은 인간-로봇 전이가 알고리즘 문제가 아니라 규모 문제라는 것이다. 손목 모션과 리타게팅된 다지 손 액션을 지도 신호로 삼아 선행 연구 대비 20배 이상 규모로 사전학습하자, 검증 손실이 데이터 양의 로그에 선형으로 감소하는 법칙이 나타났다. 더 중요한 것은 이 검증 손실이 실로봇 성능과 강하게 상관한다는 점인데, 이것이 성립하면 로봇을 돌리지 않고도 사전학습 투자의 효과를 예측할 수 있다."],
  ["2단계 전이 레시피","대규모 인간 사전학습 뒤에 정렬된 인간-로봇 play 데이터로 경량 미드트레이닝을 거쳐 로봇 감지·제어에 표현을 적응시키고, 그 다음 다운스트림 과제에 사후학습한다. 로봇 감독이 최소한만 필요하다는 것이 이 레시피의 요점이다."],
  ["결과","22자유도 다지 손에서 무사전학습 기준 대비 평균 성공률 54% 개선, 자유도가 낮은 손으로도 전이되었다. 장기 정밀 조작과 미지 스킬에 대한 one-shot 적응도 보고했다."]],
 see:["humanscale","egodex","ego2robot","spider"]},

{s:"robotarena-inf",t:"data",n:"RobotArena ∞",full:"RobotArena ∞: Scalable Robot Benchmarking via Real-to-Sim Translation",org:"—",d:"2026-03",aid:"ICLR 2026",venue:"ICLR 2026",key:1,
 lead:"수백 개 환경과 수천 건의 인간 선호로 세계 각지 연구실의 VLA를 평가한 대규모 벤치마크.",
 body:[
  ["동기","[[roboarena]]가 크라우드소싱으로 확장성을 얻었지만 여전히 DROID 환경, 다섯 개 과제, 세 개 정적 실환경 장면에 묶여 있었다. 실환경 데이터셋과 generalist 정책의 규모·복잡도가 계속 커지는 상황에서 더 확장 가능하고 지속적으로 진화하는 평가 틀이 필요하다는 것이 문제 제기다."],
  ["핵심 아이디어","실환경을 시뮬레이션으로 옮긴다. real-to-sim 변환으로 실제 장면을 대량 복제하면 평가 환경 수를 사람 손을 거치지 않고 늘릴 수 있고, 물리 엔진과 real-to-sim 연구가 진전될 때마다 벤치마크가 자동으로 좋아진다."],
  ["실측 결론","VLA는 데이터셋 차이에 매우 민감해서 학습 분포 밖 환경에서 성능이 떨어진다. 현재 모델은 진정한 generalist가 아니라 학습 데이터에 표현된 환경에 특화된 것이라는 진술이 이 논문의 핵심이다. [[pi07]] 등이 주장하는 open-world 일반화와 정면으로 대비되는 결과이므로 함께 읽을 필요가 있다."]],
 see:["roboarena","vla-arena","pi07","open-problems"]},

{s:"egolive",t:"data",n:"EgoLive",full:"EgoLive: A Large-Scale Egocentric Dataset from Real-World Human Tasks",org:"—",d:"2026-04",aid:"arXiv:2604.23570",venue:"arXiv 프리프린트",src:"abs",
 lead:"실제 인간 작업 현장에서 수집한 대규모 1인칭 데이터셋.",
 body:[
  ["위치","[[egodex]]가 테이블탑 과제에 집중했던 것과 달리 실제 작업 맥락의 행동을 담는다. 1인칭 데이터 계열의 다양성 축을 넓히는 데이터셋이다."]],
 see:["egodex","egoscale","humanscale"]},

{s:"humanscale",t:"data",n:"HumanScale",full:"HumanScale: Egocentric Human Video Can Outperform Real-Robot Data for Embodied Pretraining",org:"—",d:"2026-06",aid:"arXiv:2606.20521",venue:"arXiv 프리프린트",key:1,
 lead:"동일한 사전학습 데이터량 조건에서 1인칭 인간 영상이 원격조작 실로봇 궤적을 앞선다는 것을 보고한 통제 비교 연구.",
 body:[
  ["문제 설정","임베디드 파운데이션 모델은 LLM처럼 데이터 스케일링의 이득을 볼 것으로 기대되지만 데이터 병목이 훨씬 심하다. 원격조작 실로봇 궤적은 정확한 액션 지도와 embodiment 정합성 덕에 지배적 사전학습 소스로 남아 있으나, 수집 비용과 난이도, 낮은 행동·환경 다양성이 확장을 막는다. 1인칭 영상이 대안으로 거론되어 왔지만 실로봇 데이터와 정면 비교된 적이 없었다."],
  ["실험 설계","이 논문의 기여는 결과보다 설계에 있다. 사전학습 데이터량, 사후학습 절차, 검증 프로토콜을 고정한 채 사전학습 소스만 바꿔 비교했다. 사후학습에는 AgiBot World에서 15개 과제 × 100 데모, 총 1500 궤적을 썼다."],
  ["결과","세심한 필터링과 라벨링 파이프라인을 거친 1인칭 데이터로 사전학습하면 실로봇 액션 예측 검증 손실이 24% 낮고, in-distribution 성공률 52.5%, 분포 밖 성공률 90% 높았다. 100시간에서 5000시간 구간에서 로그-선형 법칙 L = a − b·ln(D)가 성립했고(seen R²=0.86, unseen R²=0.94) 기울기가 여전히 음수라 포화되지 않았다."],
  ["저자 해석","우위의 원인을 embodiment 정합성이 아니라 데이터 다양성으로 귀속시킨다. 1인칭 부분집합이 폭넓은 커버리지로 큐레이션되어 있어 시간을 늘려도 중복 궤적이 반복되는 대신 더 넓은 물체·스킬·환경이 들어온다는 것이다. 미지 과제에서는 관찰된 행동 공간의 폭이, 학습 과제에서는 표현의 질이 각각 개선된다고 설명한다."],
  ["함께 볼 반론","업계 정리 글들은 인터넷 스케일이라는 표현이 실제 비용을 과소평가한다고 지적한다. 손이 프레임에 잘 들어오고 흔들림이 적은 고가치 영상은 계측 장비와 큐레이션을 요구한다. [[egodex]]가 Vision Pro로 수집된 이유도 같은 맥락이다."]],
 see:["egoscale","egodex","ego2robot","agibot-go1","open-problems"]},

{s:"ego2robot",t:"data",n:"Ego2Robot",full:"Ego2Robot: Scalable Robot Data Synthesis from Egocentric Human Data",org:"—",d:"2026-08",aid:"arXiv:2608.02580",venue:"arXiv 프리프린트",src:"abs",
 lead:"1인칭 인간 영상을 로봇 형식의 학습 데이터로 변환하는 파이프라인.",
 body:[
  ["문제","선행 연구는 인간 영상을 리타게팅하고 렌더링해 로봇 데이터로 바꾸면 소규모에서 과제별 정책을 얻을 수 있다는 것까지 보였다. 그러나 이 방식이 VLA 사전학습 수준의 규모에서도 이득을 주는지는 검증되지 않았다."],
  ["핵심 아이디어","세 단계 파이프라인을 규모 있게 돌린다. 액션 리타게팅으로 인간 손 동작을 로봇 액션으로 옮기고, 로봇팔 시각 합성으로 영상에서 사람 손을 로봇으로 치환하며, 다층 품질 큐레이션으로 실패한 변환을 걸러낸다. 잠재 액션을 쓰는 [[lapa]] 계열과 달리 실제 로봇 액션 공간으로 직접 변환한다는 점이 다르다."]],
 see:["egoscale","humanscale","wh0","spider"]},
];

{h:"접촉과 힘 정보의 부재", tr:["vla","mpc"], ev:"measured",

/* ═══════════════════ 렌더링 ═══════════════════ */
const BY = Object.fromEntries(P.map(p=>[p.s,p]));
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const wl = t => String(t).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m,slug,label)=>{
  if(slug==="open-problems") return `<a href="#/open-problems">${label||"미해결 문제"}</a>`;
  if(slug==="list") return `<a href="#/list">${label||"전체 논문 목록"}</a>`;
  const p = BY[slug];
  if(!p) return `<a class="new" href="#/">${label||slug}</a>`;
  return `<a href="#/paper/${slug}">${label||p.n}</a>`;
});
const chip = k => `<span class="tk" style="color:${TRACKS[k].c};border-color:${TRACKS[k].c}">${TRACKS[k].n}</span>`;
const byDate = (a,b)=>a.d<b.d?-1:a.d>b.d?1:0;

function shell(title, sub, html, cats){
  return `<div class="tabs"><a href="#/">문서</a><a href="#/list">논문 목록</a><a href="#/timeline">연표</a><a href="#/open-problems">미해결 문제</a></div>
  <h1 class="title">${title}</h1>${sub||""}${html}
  <div class="cats"><b>분류:</b> ${cats.map(c=>`<span>${c}</span>`).join(" · ")}</div>
  <div class="foot">이 문서는 2026년 9월 3일에 마지막으로 편집되었습니다. 수치와 주장은 원 논문 또는 공식 릴리스가 보고한 값이며, 평가 프로토콜이 다른 논문의 수치는 직접 비교하지 않았습니다.</div>`;
}
